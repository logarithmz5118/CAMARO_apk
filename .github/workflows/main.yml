            <script>
              let mapSlot = null;
              setInterval(() => {
                document.getElementById('clockTxt').textContent = new Date().toTimeString().slice(0,5);
              }, 1000);

              function mountLeft(slot, embed) {
                const b = document.getElementById('carplaySlotBox').getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                AndroidBridge.mountAppInLeftBox(
                  slot,
                  embed,
                  Math.round(b.left * dpr),
                  Math.round(b.top * dpr),
                  Math.round(b.width * dpr),
                  Math.round(b.height * dpr)
                );
              }

              window.autoMountLeftSlot = function() {
                mountLeft('carplay', true);
              };

              function openHvacModal(show) {
                if (show) AndroidBridge.hidePipBox();
                document.getElementById('hvacModal').classList.toggle('show', show);
              }

              function openAppDrawer(slot) {
                if (slot === false) {
                  document.getElementById('drawerModal').classList.remove('show');
                  return;
                }
                AndroidBridge.hidePipBox();
                mapSlot = slot;
                const apps = JSON.parse(AndroidBridge.getInstalledApps() || '[]');
                document.getElementById('appListGrid').innerHTML = apps.map(a => `
                  <button class="btn" style="padding:10px; flex-direction:column; align-items:flex-start; text-align:left;" onclick="pickApp('${a.pkg}')">
                    <div style="font-size:12px; font-weight:900; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${a.name}</div>
                    <div style="font-size:9px; color:#64748b; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${a.pkg}</div>
                  </button>
                `).join('');
                document.getElementById('drawerModal').classList.add('show');
              }

              function pickApp(pkg) {
                document.getElementById('drawerModal').classList.remove('show');
                if (mapSlot) {
                  AndroidBridge.saveSlotApp(mapSlot, pkg);
                  mapSlot = null;
                  mountLeft('carplay', true);
                } else {
                  AndroidBridge.launchPackage(pkg);
                }
              }

              window.onPermCheck = function(hasNoti) {
                document.getElementById('btnNotiPerm').style.display = hasNoti ? 'none' : 'inline-block';
              };

              window.onHvacUpdate = function(st) {
                document.getElementById('uidBadge').textContent = st.uid || 'UID';
                document.getElementById('intentMonitor').textContent = st.lastIntent || '';
                document.getElementById('barTempL').textContent = st.tempLeft;
                document.getElementById('barTempR').textContent = st.tempRight;
                document.getElementById('modTempL').textContent = st.tempLeft;
                document.getElementById('modTempR').textContent = st.tempRight;
                document.getElementById('barWind').textContent = st.windLevel + '단';
                document.getElementById('modWind').textContent = st.windLevel + '단';
                document.getElementById('barAc').classList.toggle('active', !!st.ac);
                document.getElementById('barCycle').classList.toggle('active', !!st.inOutCycle);
                document.getElementById('barFrontDef').classList.toggle('active', !!st.frontDefrost);
                document.getElementById('barRearDef').classList.toggle('active', !!st.rearDefrost);
                document.getElementById('barSeatL').textContent = '💺 ' + (st.seatHeatL || 0);
                document.getElementById('barSeatR').textContent = '💺 ' + (st.seatHeatR || 0);
                document.getElementById('doorVal').textContent = st.doorOpen ? '⚠️ 열림' : '잠김';
                document.getElementById('trunkVal').textContent = st.trunkOpen ? '⚠️ 열림' : '닫힘';
              };
              window.onRealSpeed = function(s) { document.getElementById('spdVal').textContent = s; };
              window.onRealVolt = function(v) { document.getElementById('voltVal').textContent = v; };
              window.onMediaUpdate = function(m) {
                document.getElementById('songTitle').textContent = m.title || '재생 중';
                document.getElementById('songArtist').textContent = m.artist || '';
                document.getElementById('playPauseBtn').textContent = m.playing ? '❚❚ 일시정지' : '▶ 재생';
                if (m.duration > 0) {
                  document.getElementById('songProg').style.width = Math.min(100, Math.round((m.position / m.duration) * 100)) + '%';
                }
                const img = document.getElementById('albumImg');
                if (m.art) { img.src = m.art; img.style.display = 'block'; }
              };
            </script>
          </body>
          </html>
          EOF

          # 1) 일반 서명 버전 Manifest 및 빌드
          sed 's/^          //' << 'EOF' > dv_clone/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.REORDER_TASKS" />

              <application
                  android:allowBackup="true"
                  android:label="Camaro RS Launcher"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:stateNotNeeded="true"
                      android:clearTaskOnLaunch="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                      <intent-filter android:priority="1000">
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MediaNotificationService"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cd dv_clone
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk apk_out/2_Camaro_Normal_Debug.apk

          # 2) DriveView와 동일한 System UID 1000 (sharedUserId="android.uid.system") + AOSP Platform Key 서명 버전 빌드
          sed 's/^          //' << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              android:sharedUserId="android.uid.system">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.REORDER_TASKS" />

              <application
                  android:allowBackup="true"
                  android:label="Camaro RS Launcher (System)"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:stateNotNeeded="true"
                      android:clearTaskOnLaunch="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                      <intent-filter android:priority="1000">
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MediaNotificationService"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          gradle assembleDebug --no-daemon

          # AOSP Platform Key 다운로드 후 apksigner로 System UID 서명
          curl -sL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/platform.pk8 -o platform.pk8
          curl -sL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/platform.x509.pem -o platform.x509.pem

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" sign --key platform.pk8 --cert platform.x509.pem --out apk_out/1_Camaro_SystemUID_1000.apk app/build/outputs/apk/debug/app-debug.apk

      - name: 5. Upload Both System-UID & Normal APKs
        uses: actions/upload-artifact@v4
        with:
          name: Camaro-DriveViewEngine-APKs
          path: dv_clone/apk_out/*.apk
