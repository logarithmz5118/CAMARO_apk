              <uses-permission android:name="android.permission.GET_TASKS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" tools:ignore="ProtectedPermissions" />

              <application
                  android:allowBackup="true"
                  android:label="Camaro RS Launcher (System)"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:stateNotNeeded="true"
                      android:clearTaskOnLaunch="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                      <intent-filter android:priority="1000">
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MediaNotificationService"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  <service
                      android:name=".HomeReturnService"
                      android:enabled="true"
                      android:exported="false" />
                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          gradle assembleDebug --no-daemon

          curl -sL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/platform.pk8 -o platform.pk8
          curl -sL https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/platform.x509.pem -o platform.x509.pem

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" sign --key platform.pk8 --cert platform.x509.pem --out apk_out/1_Camaro_v12_SystemUID_1000.apk app/build/outputs/apk/debug/app-debug.apk

      - name: 5. Upload v12 Perfect APKs
