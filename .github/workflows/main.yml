name: Camaro 7862 v12 Perfect Edition APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Build Complete v12 Camaro APKs
        run: |
          rm -rf dv_v12
          mkdir -p dv_v12/app/src/main/java/com/camaro/launcher
          mkdir -p dv_v12/app/src/main/assets
          mkdir -p dv_v12/apk_out

          sed 's/^          //' << 'EOF' > dv_v12/settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CamaroDriveViewV12"
          include ':app'
          EOF

          sed 's/^          //' << 'EOF' > dv_v12/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          sed 's/^          //' << 'EOF' > dv_v12/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          sed 's/^          //' << 'EOF' > dv_v12/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.camaro.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.camaro.launcher"
                  minSdk 28
                  targetSdk 34
                  versionCode 12
                  versionName "12.0-Perfect-Edition"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
          }
          EOF

          sed 's/^          //' << 'EOF' > dv_v12/app/src/main/java/com/camaro/launcher/MediaNotificationService.java
          package com.camaro.launcher;
          import android.service.notification.NotificationListenerService;
          public class MediaNotificationService extends NotificationListenerService {}
          EOF

          sed 's/^          //' << 'EOF' > dv_v12/app/src/main/java/com/camaro/launcher/BootReceiver.java
          package com.camaro.launcher;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  try {
                      context.startService(new Intent(context, HomeReturnService.class));
                      Intent i = new Intent(context, MainActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      context.startActivity(i);
                  } catch (Exception ignored) {}
              }
          }
          EOF

          # 다른 앱 실행 중에도 항상 상단에 떠서 진짜 카마로 홈으로 복귀시켜주는 플로팅 버튼 + FYT 홈 버튼 감시 서비스
          sed 's/^          //' << 'EOF' > dv_v12/app/src/main/java/com/camaro/launcher/HomeReturnService.java
          package com.camaro.launcher;

          import android.annotation.SuppressLint;
          import android.app.ActivityManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.Process;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;
          import java.util.List;

          public class HomeReturnService extends Service {
              private WindowManager wm;
              private View floatingPill;
              private WindowManager.LayoutParams params;
              private final Handler handler = new Handler(Looper.getMainLooper());
              public static boolean allowStockTemporarily = false;

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  createOrShowFloatingPill();
                  startFytHomeButtonInterceptor();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (floatingPill == null) createOrShowFloatingPill();
                  return START_STICKY;
              }

              @SuppressLint("ClickableViewAccessibility")
              private void createOrShowFloatingPill() {
                  if (Process.myUid() != 1000 && !Settings.canDrawOverlays(this)) return;
                  if (floatingPill != null) return;

                  wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  TextView pill = new TextView(this);
                  pill.setText("🏠 카마로 홈");
                  pill.setTextColor(Color.parseColor("#38BDF8"));
                  pill.setTextSize(12f);
                  pill.setPadding(28, 10, 28, 10);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setCornerRadius(50f);
                  bg.setColor(Color.parseColor("#E6070B12"));
                  bg.setStroke(2, Color.parseColor("#38BDF8"));
                  pill.setBackground(bg);

                  params = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  );
                  params.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  params.y = 4;

                  // 드래그해서 위치 이동도 가능하고, 짧게 터치하면 즉시 카마로 런처 홈으로 복귀
                  pill.setOnTouchListener(new View.OnTouchListener() {
                      private int initialX, initialY;
                      private float touchX, touchY;
                      private long downTime;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  downTime = System.currentTimeMillis();
                                  initialX = params.x;
                                  initialY = params.y;
                                  touchX = event.getRawX();
                                  touchY = event.getRawY();
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  params.x = initialX + (int) (event.getRawX() - touchX);
                                  params.y = initialY + (int) (event.getRawY() - touchY);
                                  try { wm.updateViewLayout(floatingPill, params); } catch (Exception ignored) {}
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (System.currentTimeMillis() - downTime < 250 && Math.abs(event.getRawX() - touchX) < 20) {
                                      returnToCamaroHome();
                                  }
                                  return true;
                          }
                          return false;
                      }
                  });

                  try {
                      wm.addView(pill, params);
                      floatingPill = pill;
                  } catch (Exception ignored) {}
              }

              private void returnToCamaroHome() {
                  allowStockTemporarily = false;
                  try {
                      Intent i = new Intent(HomeReturnService.this, MainActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                      startActivity(i);
                  } catch (Exception ignored) {}
              }

              // 올인원 좌측 물리 홈 버튼을 눌러 순정 런처(launcher66 등)가 뜨면 0.25초 만에 감지해 카마로 홈으로 즉시 납치
              private void startFytHomeButtonInterceptor() {
                  handler.post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (floatingPill == null) createOrShowFloatingPill();
                              if (!allowStockTemporarily) {
                                  ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                                  List<ActivityManager.RunningTaskInfo> tasks = am.getRunningTasks(1);
                                  if (tasks != null && !tasks.isEmpty() && tasks.get(0).topActivity != null) {
                                      String topPkg = tasks.get(0).topActivity.getPackageName();
                                      if (topPkg.contains("launcher66") || topPkg.contains("com.fyt.launcher") || topPkg.contains("com.android.launcher3")) {
                                          returnToCamaroHome();
                                      }
                                  }
                              }
                          } catch (Exception ignored) {}
                          handler.postDelayed(this, 250L);
                      }
                  });
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (floatingPill != null && wm != null) {
                      try { wm.removeView(floatingPill); } catch (Exception ignored) {}
                      floatingPill = null;
                  }
              }
          }
          EOF

          sed 's/^          //' << 'EOF' > dv_v12/app/src/main/java/com/camaro/launcher/MainActivity.java
          package com.camaro.launcher;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.ActivityOptions;
          import android.app.role.RoleManager;
          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.ServiceConnection;
          import android.content.SharedPreferences;
          import android.content.pm.LauncherActivityInfo;
          import android.content.pm.LauncherApps;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.SurfaceTexture;
          import android.graphics.drawable.BitmapDrawable;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.hardware.input.InputManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.media.AudioManager;
          import android.media.MediaMetadata;
          import android.media.session.MediaController;
          import android.media.session.MediaSessionManager;
          import android.media.session.PlaybackState;
          import android.net.Uri;
          import android.os.BatteryManager;
          import android.os.Binder;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.Parcel;
          import android.os.Process;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.InputEvent;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.Surface;
          import android.view.TextureView;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.lsposed.hiddenapibypass.HiddenApiBypass;
          import java.io.ByteArrayOutputStream;
          import java.lang.reflect.Method;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.concurrent.ConcurrentHashMap;

          public class MainActivity extends Activity {
              private FrameLayout rootLayout;
              private WebView webView;
              private FrameLayout pipContainer;
              private TextureView textureView;
              private VirtualDisplay virtualDisplay;
              private Object inputForwarder;

              private LocationManager locationManager;
              private MediaSessionManager mediaSessionManager;
              private MediaController activeController;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private SharedPreferences prefs;

              private IBinder syuCanbusModule;
              private final Map<Integer, Integer> liveCanCodes = new ConcurrentHashMap<>();
              private final JSONObject hvacState = new JSONObject();
              private JSONArray cachedAppCatalog = null;

              private int codeTempL = 27;
              private int codeTempR = 28;
              private int codeWind = 21;
              private int codeAc = 11;
              private int codeCycle = 12;
              private int codeFrontDef = 15;
              private int codeRearDef = 16;
              private int codeSeatL = 29;
              private int codeSeatR = 30;
              private int codeOutTemp = 40;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      try { HiddenApiBypass.addHiddenApiExemptions(""); } catch (Exception ignored) {}
                  }
                  prefs = getSharedPreferences("camaro_v12_prefs", Context.MODE_PRIVATE);
                  loadCustomCanMapping();
                  initDefaultState();
                  autoEnableNotificationListenerIfSystem();

                  rootLayout = new FrameLayout(this);
                  webView = new WebView(this);
                  rootLayout.addView(webView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ));

                  setupDriveViewVirtualSlot();
                  setContentView(rootLayout);
                  hideSystemUI();

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          startAllServices();
                      }
                  });
                  webView.addJavascriptInterface(new CarBridge(), "AndroidBridge");
                  webView.loadUrl("file:///android_asset/index.html");
              }

              // System UID=1000으로 실행된 경우 사용자가 설정에 들어가지 않아도 알림 접근 권한을 자동으로 부여
              private void autoEnableNotificationListenerIfSystem() {
                  try {
                      String flat = new ComponentName(this, MediaNotificationService.class).flattenToString();
                      String cur = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                      if (cur == null || !cur.contains(flat)) {
                          String next = (cur == null || cur.isEmpty()) ? flat : (cur + ":" + flat);
                          Settings.Secure.putString(getContentResolver(), "enabled_notification_listeners", next);
                      }
                  } catch (Exception ignored) {}
              }

              private void loadCustomCanMapping() {
                  codeTempL = prefs.getInt("map_tempL", 27);
                  codeTempR = prefs.getInt("map_tempR", 28);
                  codeWind = prefs.getInt("map_wind", 21);
                  codeAc = prefs.getInt("map_ac", 11);
                  codeCycle = prefs.getInt("map_cycle", 12);
                  codeFrontDef = prefs.getInt("map_frontDef", 15);
                  codeRearDef = prefs.getInt("map_rearDef", 16);
                  codeSeatL = prefs.getInt("map_seatL", 29);
                  codeSeatR = prefs.getInt("map_seatR", 30);
                  codeOutTemp = prefs.getInt("map_outTemp", 40);
              }

              private void initDefaultState() {
                  try {
                      hvacState.put("ac", true);
                      hvacState.put("inOutCycle", true);
                      hvacState.put("frontDefrost", false);
                      hvacState.put("rearDefrost", false);
                      hvacState.put("windLevel", 4);
                      hvacState.put("tempLeft", "LO");
                      hvacState.put("tempRight", "LO");
                      hvacState.put("seatHeatL", 0);
                      hvacState.put("seatHeatR", 0);
                      hvacState.put("doorOpen", false);
                      hvacState.put("trunkOpen", false);
                      hvacState.put("outTemp", "13.5°C");
                      hvacState.put("uid", "UID=" + Process.myUid());
                      hvacState.put("lastRaw", "CAN 연결중");
                  } catch (Exception ignored) {}
              }

              @SuppressLint("ClickableViewAccessibility")
              private void setupDriveViewVirtualSlot() {
                  pipContainer = new FrameLayout(this);
                  pipContainer.setVisibility(View.GONE);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setCornerRadius(18f);
                  bg.setColor(Color.BLACK);
                  pipContainer.setBackground(bg);
                  pipContainer.setClipToOutline(true);

                  textureView = new TextureView(this);
                  textureView.setSurfaceTextureListener(new TextureView.SurfaceTextureListener() {
                      @Override
                      public void onSurfaceTextureAvailable(SurfaceTexture surface, int width, int height) {
                          createSlotDisplay(new Surface(surface), width, height);
                      }
                      @Override
                      public void onSurfaceTextureSizeChanged(SurfaceTexture surface, int width, int height) {
                          if (virtualDisplay != null) virtualDisplay.resize(width, height, 180);
                      }
                      @Override
                      public boolean onSurfaceTextureDestroyed(SurfaceTexture surface) {
                          if (virtualDisplay != null) {
                              virtualDisplay.release();
                              virtualDisplay = null;
                          }
                          return true;
                      }
                      @Override
                      public void onSurfaceTextureUpdated(SurfaceTexture surface) {}
                  });

                  textureView.setOnTouchListener((v, event) -> {
                      if (virtualDisplay == null) return false;
                      int displayId = virtualDisplay.getDisplay().getDisplayId();
                      try {
                          if (inputForwarder != null) {
                              Method fwd = inputForwarder.getClass().getMethod("forwardEvent", InputEvent.class);
                              fwd.invoke(inputForwarder, event);
                              return true;
                          }
                      } catch (Exception ignored) {}

                      try {
                          MotionEvent copy = MotionEvent.obtain(event);
                          Method setDisp = InputEvent.class.getDeclaredMethod("setDisplayId", int.class);
                          setDisp.setAccessible(true);
                          setDisp.invoke(copy, displayId);

                          InputManager im = (InputManager) getSystemService(Context.INPUT_SERVICE);
                          Method inject = InputManager.class.getDeclaredMethod("injectInputEvent", InputEvent.class, int.class);
                          inject.setAccessible(true);
                          inject.invoke(im, copy, 0);
                          copy.recycle();
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  });

                  pipContainer.addView(textureView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ));
                  rootLayout.addView(pipContainer);
              }

              private void createSlotDisplay(Surface surface, int w, int h) {
                  try {
                      DisplayManager dm = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                      if (virtualDisplay != null) virtualDisplay.release();
                      int flags = DisplayManager.VIRTUAL_DISPLAY_FLAG_PUBLIC | DisplayManager.VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY | (1 << 10);
                      try {
                          virtualDisplay = dm.createVirtualDisplay("DriveViewSlot0", w > 100 ? w : 680, h > 100 ? h : 480, 180, surface, flags);
                      } catch (SecurityException se) {
                          virtualDisplay = dm.createVirtualDisplay("DriveViewSlot0", w > 100 ? w : 680, h > 100 ? h : 480, 180, surface,
                              DisplayManager.VIRTUAL_DISPLAY_FLAG_PUBLIC | DisplayManager.VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY);
                      }
                      if (virtualDisplay != null) {
                          try {
                              InputManager im = (InputManager) getSystemService(Context.INPUT_SERVICE);
                              Method cf = InputManager.class.getDeclaredMethod("createInputForwarder", int.class);
                              cf.setAccessible(true);
                              inputForwarder = cf.invoke(im, virtualDisplay.getDisplay().getDisplayId());
                          } catch (Exception ignored) {}
                      }
                  } catch (Exception ignored) {}
              }

              private void startAllServices() {
                  try { startService(new Intent(this, HomeReturnService.class)); } catch (Exception ignored) {}
                  bindFytSyuToolkit();
                  startBroadcastReceivers();
                  startGpsSpeed();
                  startMediaTracker();
                  pushStateToUi();
              }

              // FYT com.syu.ms 바인딩: 모듈 7번(CANBUS) + 모듈 2번(BT 블루투스 음악) + 모듈 8번(순정 뮤직) 동시 연결
              private void bindFytSyuToolkit() {
                  String[] pkgs = new String[]{"com.syu.ms", "com.syu.canbus"};
                  for (String pkg : pkgs) {
                      try {
                          Intent intent = new Intent("com.syu.ms.toolkit").setPackage(pkg);
                          bindService(intent, new ServiceConnection() {
                              @Override
                              public void onServiceConnected(ComponentName name, IBinder service) {
                                  if (service == null) return;
                                  try {
                                      syuCanbusModule = getSyuModule(service, 7); // 7 = CANBUS
                                      if (syuCanbusModule != null) {
                                          registerSyuCanbusCallbacks(syuCanbusModule);
                                          hvacState.put("lastRaw", "FYT 7862 CAN 직결됨");
                                          pushStateToUi();
                                      }
                                      // FYT 블루투스 오디오(모듈 2)에서 곡 제목/가수 문자열 수신
                                      IBinder btModule = getSyuModule(service, 2);
                                      if (btModule != null) registerSyuBtMusicCallbacks(btModule);
                                  } catch (Exception ignored) {}
                              }
                              @Override
                              public void onServiceDisconnected(ComponentName name) {}
                          }, Context.BIND_AUTO_CREATE);
                      } catch (Exception ignored) {}
                  }
              }

              private IBinder getSyuModule(IBinder toolkit, int moduleCode) {
                  try {
                      Parcel data = Parcel.obtain();
                      Parcel reply = Parcel.obtain();
                      data.writeInterfaceToken("com.syu.ipc.IRemoteToolkit");
                      data.writeInt(moduleCode);
                      toolkit.transact(1, data, reply, 0);
                      reply.readException();
                      IBinder b = reply.readStrongBinder();
                      data.recycle();
                      reply.recycle();
                      return b;
                  } catch (Exception e) { return null; }
              }

              private void registerSyuCanbusCallbacks(IBinder moduleBinder) {
                  Binder cb = new Binder() {
                      @Override
                      protected boolean onTransact(int code, Parcel data, Parcel reply, int flags) {
                          if (code == 1) {
                              try {
                                  data.enforceInterface("com.syu.ipc.IModuleCallback");
                                  int uCode = data.readInt();
                                  int[] ints = data.createIntArray();
                                  if (ints != null && ints.length > 0) {
                                      onCanbusCodeReceived(uCode, ints[0]);
                                  }
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  };
                  for (int i = 0; i <= 180; i++) {
                      try {
                          Parcel p = Parcel.obtain();
                          Parcel r = Parcel.obtain();
                          p.writeInterfaceToken("com.syu.ipc.IRemoteModule");
                          p.writeStrongBinder(cb);
                          p.writeInt(i);
                          p.writeInt(1);
                          moduleBinder.transact(2, p, r, 0);
                          p.recycle();
                          r.recycle();
                      } catch (Exception ignored) {}
                  }
              }

              private void registerSyuBtMusicCallbacks(IBinder btBinder) {
                  Binder cb = new Binder() {
                      @Override
                      protected boolean onTransact(int code, Parcel data, Parcel reply, int flags) {
                          if (code == 1) {
                              try {
                                  data.enforceInterface("com.syu.ipc.IModuleCallback");
                                  int uCode = data.readInt();
                                  data.createIntArray();
                                  data.createFloatArray();
                                  String[] strs = data.createStringArray();
                                  if (strs != null && strs.length > 0 && strs[0] != null && !strs[0].isEmpty()) {
                                      JSONObject obj = new JSONObject();
                                      obj.put("title", strs[0]);
                                      obj.put("artist", "FYT Bluetooth Audio");
                                      obj.put("playing", true);
                                      sendJs("if(window.onMediaUpdate) window.onMediaUpdate(" + obj.toString() + ");");
                                  }
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  };
                  for (int i = 0; i <= 30; i++) {
                      try {
                          Parcel p = Parcel.obtain();
                          Parcel r = Parcel.obtain();
                          p.writeInterfaceToken("com.syu.ipc.IRemoteModule");
                          p.writeStrongBinder(cb);
                          p.writeInt(i);
                          p.writeInt(1);
                          btBinder.transact(2, p, r, 0);
                          p.recycle();
                          r.recycle();
                      } catch (Exception ignored) {}
                  }
              }

              private void onCanbusCodeReceived(int code, int val) {
                  liveCanCodes.put(code, val);
                  try {
                      hvacState.put("lastRaw", "CAN[" + code + "]=" + val);
                      if (code == 0 || code == 1 || code == 2 || code == 3) {
                          hvacState.put("doorOpen", val > 0);
                      } else if (code == 4 || code == 5) {
                          hvacState.put("trunkOpen", val > 0);
                      } else if (code == codeAc) {
                          hvacState.put("ac", val > 0);
                      } else if (code == codeCycle) {
                          hvacState.put("inOutCycle", val > 0);
                      } else if (code == codeFrontDef || code == 18) {
                          hvacState.put("frontDefrost", val > 0);
                      } else if (code == codeRearDef) {
                          hvacState.put("rearDefrost", val > 0);
                      } else if (code == codeWind) {
                          hvacState.put("windLevel", Math.max(0, Math.min(7, val)));
                      } else if (code == codeTempL) {
                          hvacState.put("tempLeft", formatCamaroTemp(val));
                      } else if (code == codeTempR) {
                          hvacState.put("tempRight", formatCamaroTemp(val));
                      } else if (code == codeSeatL) {
                          hvacState.put("seatHeatL", Math.max(0, Math.min(3, val)));
                      } else if (code == codeSeatR) {
                          hvacState.put("seatHeatR", Math.max(0, Math.min(3, val)));
                      } else if (code == codeOutTemp) {
                          hvacState.put("outTemp", formatOutTemp(val));
                      }
                  } catch (Exception ignored) {}
                  pushStateToUi();
              }

              private String formatCamaroTemp(int v) {
                  if (v <= 0 || v == 254) return "LO";
                  if (v == 30 || v == 255 || v >= 1000) return "HI";
                  if (v >= 1 && v <= 28) return String.format(Locale.US, "%.1f°", 15.5f + (v * 0.5f));
                  if (v >= 30 && v <= 65) return String.format(Locale.US, "%.1f°", v / 2.0f);
                  if (v >= 150 && v <= 320) return String.format(Locale.US, "%.1f°", v / 10.0f);
                  return v + "°";
              }

              private String formatOutTemp(int v) {
                  if (v >= -40 && v <= 60) return v + ".0°C";
                  if (v >= 50 && v <= 180) return String.format(Locale.US, "%.1f°C", (v / 2.0f) - 40.0f);
                  return v + "°C";
              }

              // 배터리, CANbus 패킷(2E C6 ...), 표준 안드로이드 음악 브로드캐스트(metachanged) 통합 수신
              private void startBroadcastReceivers() {
                  IntentFilter filter = new IntentFilter();
                  filter.addAction(Intent.ACTION_BATTERY_CHANGED);
                  filter.addAction("com.android.music.metachanged");
                  filter.addAction("com.android.music.playstatechanged");
                  filter.addAction("com.syu.music.metachanged");
                  filter.addAction("com.syu.bt.metachanged");
                  filter.addAction("com.syu.ms.action.CANBUS_AIR");
                  filter.addAction("com.ATC.ac.ACMessage");
                  filter.addAction("com.xyauto.broadcast.canbus.air");
                  filter.addAction("com.canbus.air");

                  registerReceiver(new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          if (intent == null || intent.getAction() == null) return;
                          String act = intent.getAction();
                          if (Intent.ACTION_BATTERY_CHANGED.equals(act)) {
                              int mv = intent.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0);
                              if (mv > 0) {
                                  float v = mv > 1000 ? mv / 1000.0f : (float) mv;
                                  float disp = (v >= 3.0f && v <= 5.0f) ? 14.3f : v;
                                  sendJs("if(window.onRealVolt) window.onRealVolt('" + String.format(Locale.US, "%.1fV", disp) + "');");
                              }
                              return;
                          }
                          if (act.contains("metachanged") || act.contains("playstatechanged")) {
                              String track = intent.getStringExtra("track");
                              if (track == null) track = intent.getStringExtra("title");
                              String artist = intent.getStringExtra("artist");
                              boolean playing = intent.getBooleanExtra("playing", true);
                              if (track != null && !track.isEmpty()) {
                                  try {
                                      JSONObject o = new JSONObject();
                                      o.put("title", track);
                                      o.put("artist", artist != null ? artist : "차량 미디어");
                                      o.put("playing", playing);
                                      sendJs("if(window.onMediaUpdate) window.onMediaUpdate(" + o.toString() + ");");
                                  } catch (Exception ignored) {}
                              }
                              return;
                          }
                          Bundle b = intent.getExtras();
                          if (b != null) {
                              for (String k : b.keySet()) {
                                  Object val = b.get(k);
                                  if (val instanceof byte[]) {
                                      parseRaw2ECamaroPacket((byte[]) val);
                                  }
                              }
                          }
                      }
                  }, filter);
              }

              private void parseRaw2ECamaroPacket(byte[] f) {
                  if (f == null || f.length < 5) return;
                  try {
                      if ((f[0] & 0xFF) == 0x2E) {
                          int type = f[1] & 0xFF;
                          if (type == 0xC6 || type == 0x21 || type == 0x23) {
                              int d0 = f[3] & 0xFF;
                              int d1 = f[4] & 0xFF;
                              int d2 = f.length > 5 ? (f[5] & 0xFF) : 0;
                              int d3 = f.length > 6 ? (f[6] & 0xFF) : d2;
                              hvacState.put("ac", (d0 & 0x40) != 0);
                              hvacState.put("inOutCycle", (d0 & 0x20) == 0);
                              hvacState.put("windLevel", d1 & 0x07);
                              hvacState.put("tempLeft", formatCamaroTemp(d2));
                              hvacState.put("tempRight", formatCamaroTemp(d3));
                              pushStateToUi();
                          }
                      }
                  } catch (Exception ignored) {}
              }

              private void sendSyuCanbusCmd(int cmd, int param) {
                  if (syuCanbusModule == null) return;
                  try {
                      Parcel p = Parcel.obtain();
                      Parcel r = Parcel.obtain();
                      p.writeInterfaceToken("com.syu.ipc.IRemoteModule");
                      p.writeInt(cmd);
                      p.writeIntArray(new int[]{param});
                      p.writeFloatArray(null);
                      p.writeStringArray(null);
                      syuCanbusModule.transact(1, p, r, 0);
                      p.recycle();
                      r.recycle();
                  } catch (Exception ignored) {}
              }

              private void pushStateToUi() {
                  sendJs("if(window.onHvacUpdate) window.onHvacUpdate(" + hvacState.toString() + ");");
              }

              private void startGpsSpeed() {
                  locationManager = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                  if (checkSelfPermission(android.Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{android.Manifest.permission.ACCESS_FINE_LOCATION}, 101);
                      return;
                  }
                  try {
                      locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 400L, 0f, new LocationListener() {
                          @Override
                          public void onLocationChanged(Location loc) {
                              sendJs("if(window.onRealSpeed) window.onRealSpeed(" + Math.round(loc.getSpeed() * 3.6f) + ");");
                          }
                          @Override public void onStatusChanged(String p, int s, Bundle e) {}
                          @Override public void onProviderEnabled(String p) {}
                          @Override public void onProviderDisabled(String p) {}
                      });
                  } catch (Exception ignored) {}
              }

              private void startMediaTracker() {
                  handler.post(new Runnable() {
                      @Override
                      public void run() {
                          pollMedia();
                          handler.postDelayed(this, 1000L);
                      }
                  });
              }

              private void pollMedia() {
                  try {
                      autoEnableNotificationListenerIfSystem();
                      String listeners = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                      boolean hasNoti = (Process.myUid() == 1000) || (listeners != null && listeners.contains(getPackageName()));
                      boolean hasOverlay = (Process.myUid() == 1000) || Settings.canDrawOverlays(this);
                      sendJs("if(window.onPermCheck) window.onPermCheck(" + hasNoti + ", " + hasOverlay + ");");

                      mediaSessionManager = (MediaSessionManager) getSystemService(Context.MEDIA_SESSION_SERVICE);
                      ComponentName comp = new ComponentName(this, MediaNotificationService.class);
                      List<MediaController> ctrls = null;
                      try {
                          ctrls = mediaSessionManager.getActiveSessions(comp);
                      } catch (SecurityException se) {
                          if (Process.myUid() == 1000) {
                              ctrls = mediaSessionManager.getActiveSessions(null);
                          }
                      }
                      if (ctrls != null && !ctrls.isEmpty()) {
                          activeController = ctrls.get(0);
                          for (MediaController mc : ctrls) {
                              if (mc.getPlaybackState() != null && mc.getPlaybackState().getState() == PlaybackState.STATE_PLAYING) {
                                  activeController = mc;
                                  break;
                              }
                          }
                          MediaMetadata m = activeController.getMetadata();
                          PlaybackState st = activeController.getPlaybackState();
                          JSONObject obj = new JSONObject();
                          obj.put("title", m != null && m.getString(MediaMetadata.METADATA_KEY_TITLE) != null ? m.getString(MediaMetadata.METADATA_KEY_TITLE) : "재생 중인 트랙");
                          obj.put("artist", m != null && m.getString(MediaMetadata.METADATA_KEY_ARTIST) != null ? m.getString(MediaMetadata.METADATA_KEY_ARTIST) : activeController.getPackageName());
                          obj.put("duration", m != null ? m.getLong(MediaMetadata.METADATA_KEY_DURATION) : 0L);
                          obj.put("position", st != null ? st.getPosition() : 0L);
                          obj.put("playing", st != null && st.getState() == PlaybackState.STATE_PLAYING);

                          Bitmap bmp = m != null ? m.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART) : null;
                          if (bmp == null && m != null) bmp = m.getBitmap(MediaMetadata.METADATA_KEY_ART);
                          if (bmp != null) {
                              ByteArrayOutputStream bos = new ByteArrayOutputStream();
                              bmp.compress(Bitmap.CompressFormat.JPEG, 70, bos);
                              obj.put("art", "data:image/jpeg;base64," + Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP));
                          }
                          sendJs("if(window.onMediaUpdate) window.onMediaUpdate(" + obj.toString() + ");");
                      }
                  } catch (Exception ignored) {}
              }

              private String drawableToBase64(Drawable d) {
                  if (d == null) return "";
                  try {
                      Bitmap bmp;
                      if (d instanceof BitmapDrawable && ((BitmapDrawable) d).getBitmap() != null) {
                          bmp = Bitmap.createScaledBitmap(((BitmapDrawable) d).getBitmap(), 72, 72, true);
                      } else {
                          bmp = Bitmap.createBitmap(72, 72, Bitmap.Config.ARGB_8888);
                          Canvas c = new Canvas(bmp);
                          d.setBounds(0, 0, c.getWidth(), c.getHeight());
                          d.draw(c);
                      }
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      bmp.compress(Bitmap.CompressFormat.PNG, 85, bos);
                      return "data:image/png;base64," + Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP);
                  } catch (Exception e) { return ""; }
              }

