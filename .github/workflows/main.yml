name: Camaro 7862 FYT Final Complete APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Build Complete FYT 7862 Camaro APK
        run: |
          rm -rf fyt_final
          mkdir -p fyt_final/app/src/main/java/com/camaro/launcher
          mkdir -p fyt_final/app/src/main/assets

          cat << 'EOF' > fyt_final/settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CamaroFYTLauncher"
          include(":app")
          EOF

          cat << 'EOF' > fyt_final/build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > fyt_final/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > fyt_final/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.camaro.launcher"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.camaro.launcher"
                  minSdk = 28
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0-FYT7862-Final"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("org.lsposed.hiddenapibypass:hiddenapibypass:4.3")
          }
          EOF

          cat << 'EOF' > fyt_final/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.REORDER_TASKS" />
              <uses-permission android:name="android.permission.GET_TASKS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />

              <application
                  android:allowBackup="true"
                  android:label="Camaro RS Launcher"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:stateNotNeeded="true"
                      android:clearTaskOnLaunch="true"
                      android:excludeFromRecents="false"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                      <intent-filter android:priority="1000">
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.MONKEY" />
                      </intent-filter>
                  </activity>

                  <!-- DriveView 동일: 미디어 세션 알림 리스너 -->
                  <service
                      android:name=".MediaNotificationService"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <!-- DriveView 동일: 물리 홈 버튼 가로채기 및 상시 복귀 플로팅 핸들 서비스 -->
                  <service
                      android:name=".HomeReturnService"
                      android:enabled="true"
                      android:exported="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > fyt_final/app/src/main/java/com/camaro/launcher/MediaNotificationService.kt
          package com.camaro.launcher
          import android.service.notification.NotificationListenerService
          class MediaNotificationService : NotificationListenerService()
          EOF

          cat << 'EOF' > fyt_final/app/src/main/java/com/camaro/launcher/BootReceiver.kt
          package com.camaro.launcher
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val i = Intent(context, MainActivity::class.java).apply {
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  context.startActivity(i)
              }
          }
          EOF

          cat << 'EOF' > fyt_final/app/src/main/java/com/camaro/launcher/HomeReturnService.kt
          package com.camaro.launcher

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.*
          import android.provider.Settings
          import android.view.*
          import android.widget.TextView

          class HomeReturnService : Service() {
              private var wm: WindowManager? = null
              private var floatingBtn: View? = null
              private val handler = Handler(Looper.getMainLooper())
              companion object {
                  var allowStockLauncherTemporarily = false
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  createFloatingHomePill()
                  startFytHomeHijacker()
              }

              // 다른 앱(풀화면 카플레이/티맵) 실행 중이거나 물리 홈 버튼이 순정 런처를 띄웠을 때 언제든 돌아오는 미니 홈 알약 버튼
              private fun createFloatingHomePill() {
                  if (!Settings.canDrawOverlays(this)) return
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val pill = TextView(this).apply {
                      text = "🏠 카마로 홈"
                      setTextColor(Color.parseColor("#38BDF8"))
                      textSize = 11f
                      setPadding(24, 10, 24, 10)
                      background = GradientDrawable().apply {
                          cornerRadius = 40f
                          setColor(Color.parseColor("#CC090D16"))
                          setStroke(2, Color.parseColor("#6638BDF8"))
                      }
                      setOnClickListener {
                          allowStockLauncherTemporarily = false
                          val i = Intent(this@HomeReturnService, MainActivity::class.java).apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                          }
                          startActivity(i)
                      }
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      y = 4
                  }
                  try {
                      wm?.addView(pill, params)
                      floatingBtn = pill
                  } catch (e: Exception) {}
              }

              // FYT 7862 물리 홈 버튼이 com.android.launcher66을 호출하면 즉시 감지하여 Camaro 런처로 리다이렉트
              private fun startFytHomeHijacker() {
                  handler.post(object : Runnable {
                      override fun run() {
                          try {
                              if (!allowStockLauncherTemporarily) {
                                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                                  @Suppress("DEPRECATION")
                                  val tasks = am.getRunningTasks(1)
                                  if (tasks.isNotEmpty()) {
                                      val topPkg = tasks[0].topActivity?.packageName ?: ""
                                      if (topPkg.contains("launcher66") || topPkg.contains("com.fyt.launcher") || topPkg.contains("com.android.launcher3")) {
                                          val i = Intent(this@HomeReturnService, MainActivity::class.java).apply {
                                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                                          }
                                          startActivity(i)
                                      }
                                  }
                              }
                          } catch (e: Exception) {}
                          handler.postDelayed(this, 350L)
                      }
                  })
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (floatingBtn != null) {
                      try { wm?.removeView(floatingBtn) } catch (e: Exception) {}
                  }
              }
          }
          EOF

          cat << 'EOF' > fyt_final/app/src/main/java/com/camaro/launcher/MainActivity.kt
          package com.camaro.launcher

          import android.annotation.SuppressLint
          import android.app.*
          import android.app.role.RoleManager
          import android.content.*
          import android.content.pm.PackageManager
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.hardware.input.InputManager
          import android.location.*
          import android.media.*
          import android.media.session.*
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.util.Base64
          import android.view.*
          import android.webkit.*
          import android.widget.*
          import org.json.JSONArray
          import org.json.JSONObject
          import org.lsposed.hiddenapibypass.HiddenApiBypass
          import java.io.ByteArrayOutputStream
          import kotlin.math.roundToInt

          class MainActivity : Activity() {
              private lateinit var rootLayout: FrameLayout
              private lateinit var webView: WebView
              private var pipContainer: FrameLayout? = null
              private var textureView: TextureView? = null
              private var virtualDisplay: VirtualDisplay? = null

              private var locationManager: LocationManager? = null
              private var mediaSessionManager: MediaSessionManager? = null
              private var activeController: MediaController? = null
              private val handler = Handler(Looper.getMainLooper())
              private lateinit var prefs: SharedPreferences
              private var syuCanbusModule: IBinder? = null

              private val hvacState = JSONObject().apply {
                  put("ac", true)
                  put("inOutCycle", true)
                  put("frontDefrost", false)
                  put("rearDefrost", false)
                  put("windLevel", 2)
                  put("tempLeft", "LO")
                  put("tempRight", "LO")
                  put("seatHeatL", 0)
                  put("seatHeatR", 0)
                  put("doorOpen", false)
                  put("trunkOpen", false)
                  put("lastRaw", "대기중")
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      try { HiddenApiBypass.addHiddenApiExemptions("") } catch (e: Exception) {}
                  }

                  prefs = getSharedPreferences("camaro_fyt_final", Context.MODE_PRIVATE)
                  rootLayout = FrameLayout(this)
                  webView = WebView(this)
                  rootLayout.addView(webView, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))

                  setupInteractiveVirtualDisplay()
                  setContentView(rootLayout)
                  hideSystemUI()

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      mediaPlaybackRequiresUserGesture = false
                  }
                  webView.webChromeClient = WebChromeClient()
                  webView.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          initSystems()
                      }
                  }
                  webView.addJavascriptInterface(FytCarBridge(this), "AndroidBridge")
                  webView.loadUrl("file:///android_asset/index.html")
              }

              // DriveView의 핵심: 4:3 박스에 띄운 외부 앱에 실시간 터치 주입 (InputEvent.setDisplayId + injectInputEvent)
              @SuppressLint("ClickableViewAccessibility")
              private fun setupInteractiveVirtualDisplay() {
                  pipContainer = FrameLayout(this).apply {
                      visibility = View.GONE
                      background = GradientDrawable().apply {
                          cornerRadius = 20f
                          setColor(Color.BLACK)
                      }
                      clipToOutline = true
                  }
                  textureView = TextureView(this)
                  textureView?.surfaceTextureListener = object : TextureView.SurfaceTextureListener {
                      override fun onSurfaceTextureAvailable(surface: SurfaceTexture, width: Int, height: Int) {
                          createVirtualDisplay(Surface(surface), width, height)
                      }
                      override fun onSurfaceTextureSizeChanged(surface: SurfaceTexture, width: Int, height: Int) {
                          virtualDisplay?.resize(width, height, 220)
                      }
                      override fun onSurfaceTextureDestroyed(surface: SurfaceTexture): Boolean {
                          virtualDisplay?.release()
                          virtualDisplay = null
                          return true
                      }
                      override fun onSurfaceTextureUpdated(surface: SurfaceTexture) {}
                  }

                  // 터치 이벤트를 VirtualDisplay 내부의 카플레이/티맵으로 직접 전달
                  textureView?.setOnTouchListener { _, event ->
                      val vd = virtualDisplay ?: return@setOnTouchListener false
                      val displayId = vd.display.displayId
                      try {
                          val copy = MotionEvent.obtain(event)
                          val setDisplayIdMethod = InputEvent::class.java.getDeclaredMethod("setDisplayId", Int::class.javaPrimitiveType)
                          setDisplayIdMethod.isAccessible = true
                          setDisplayIdMethod.invoke(copy, displayId)

                          val im = getSystemService(Context.INPUT_SERVICE) as InputManager
                          val injectMethod = InputManager::class.java.getDeclaredMethod(
                              "injectInputEvent",
                              InputEvent::class.java,
                              Int::class.javaPrimitiveType
                          )
                          injectMethod.isAccessible = true
                          injectMethod.invoke(im, copy, 0)
                          copy.recycle()
                          true
                      } catch (e: Exception) {
                          false
                      }
                  }

                  pipContainer?.addView(textureView, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ))
                  rootLayout.addView(pipContainer)
              }

              private fun createVirtualDisplay(surface: Surface, width: Int, height: Int) {
                  try {
                      val dm = getSystemService(Context.DISPLAY_SERVICE) as DisplayManager
                      virtualDisplay?.release()
                      virtualDisplay = dm.createVirtualDisplay(
                          "CamaroCarPlayVD",
                          if (width > 100) width else 700,
                          if (height > 100) height else 500,
                          220,
                          surface,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_PUBLIC or DisplayManager.VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY
                      )
                  } catch (e: Exception) {}
              }

              private fun initSystems() {
                  if (Settings.canDrawOverlays(this)) {
                      startService(Intent(this, HomeReturnService::class.java))
                  }
                  bindFytSyuToolkitService()
                  startBatteryAndCanbusBroadcasts()
                  startGpsSpeed()
                  startMediaSessionPolling()
                  pushHvacToUi()
              }

              private fun bindFytSyuToolkitService() {
                  val pkgs = listOf("com.syu.ms", "com.syu.canbus")
                  for (pkg in pkgs) {
                      try {
                          val intent = Intent("com.syu.ms.toolkit").setPackage(pkg)
                          bindService(intent, object : ServiceConnection {
                              override fun onServiceConnected(name: ComponentName?, service: IBinder?) {
                                  if (service == null) return
                                  try {
                                      val data = Parcel.obtain()
                                      val reply = Parcel.obtain()
                                      data.writeInterfaceToken("com.syu.ipc.IRemoteToolkit")
                                      data.writeInt(7) // MODULE_CANBUS = 7
                                      service.transact(1, data, reply, 0)
                                      reply.readException()
                                      syuCanbusModule = reply.readStrongBinder()
                                      data.recycle()
                                      reply.recycle()
                                      if (syuCanbusModule != null) {
                                          registerCanbusCodes(syuCanbusModule!!)
                                          sendJs("window.onCanbusBadge('FYT 7862 LZ-Camaro 연결됨')")
                                      }
                                  } catch (e: Exception) {}
                              }
                              override fun onServiceDisconnected(name: ComponentName?) {}
                          }, Context.BIND_AUTO_CREATE)
                      } catch (e: Exception) {}
                  }
              }

              private fun registerCanbusCodes(moduleBinder: IBinder) {
                  val cb = object : Binder() {
                      override fun onTransact(code: Int, data: Parcel, reply: Parcel?, flags: Int): Boolean {
                          if (code == 1) {
                              try {
                                  data.enforceInterface("com.syu.ipc.IModuleCallback")
                                  val uCode = data.readInt()
                                  val ints = data.createIntArray()
                                  if (ints != null && ints.isNotEmpty()) {
                                      onSyuUpdate(uCode, ints[0])
                                  }
                              } catch (e: Exception) {}
                              return true
                          }
                          return super.onTransact(code, data, reply, flags)
                      }
                  }
                  for (i in 0..120) {
                      try {
                          val p = Parcel.obtain()
                          val r = Parcel.obtain()
                          p.writeInterfaceToken("com.syu.ipc.IRemoteModule")
                          p.writeStrongBinder(cb)
                          p.writeInt(i)
                          p.writeInt(1)
                          moduleBinder.transact(2, p, r, 0)
                          p.recycle()
                          r.recycle()
                      } catch (e: Exception) {}
                  }
              }

              private fun onSyuUpdate(code: Int, value: Int) {
                  hvacState.put("lastRaw", "Code[$code]=$value")
                  when (code) {
                      0, 1, 2, 3 -> hvacState.put("doorOpen", value == 1)
                      4 -> hvacState.put("trunkOpen", value == 1)
                      11 -> hvacState.put("ac", value == 1)
                      12 -> hvacState.put("inOutCycle", value == 1)
                      15, 18 -> hvacState.put("frontDefrost", value == 1)
                      16 -> hvacState.put("rearDefrost", value == 1)
                      21 -> hvacState.put("windLevel", value.coerceIn(0, 7))
                      27 -> hvacState.put("tempLeft", parseCamaroTemp(value))
                      28 -> hvacState.put("tempRight", parseCamaroTemp(value))
                      29 -> hvacState.put("seatHeatL", value.coerceIn(0, 3))
                      30 -> hvacState.put("seatHeatR", value.coerceIn(0, 3))
                  }
                  pushHvacToUi()
              }

              private fun parseCamaroTemp(v: Int): String {
                  return when {
                      v <= 0 || v == 254 -> "LO"
                      v == 255 || v >= 1000 -> "HI"
                      v in 15..32 -> "${v}.0°"
                      v in 30..65 -> String.format("%.1f°", v / 2.0f)
                      v in 150..320 -> String.format("%.1f°", v / 10.0f)
                      else -> "${v}°"
                  }
              }

              private fun startBatteryAndCanbusBroadcasts() {
                  val filter = IntentFilter().apply {
                      addAction(Intent.ACTION_BATTERY_CHANGED)
                  }
                  registerReceiver(object : BroadcastReceiver() {
                      override fun onReceive(context: Context?, intent: Intent?) {
                          if (intent?.action == Intent.ACTION_BATTERY_CHANGED) {
                              val mv = intent.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0)
                              if (mv > 0) {
                                  val v = if (mv > 1000) mv / 1000.0f else mv.toFloat()
                                  val disp = if (v in 3.0..5.0) 14.3f else v
                                  sendJs("window.onRealVolt('${String.format("%.1f", disp)}V')")
                              }
                          }
                      }
                  }, filter)
              }

              private fun sendFytCanbusCmd(cmd: Int, param: Int) {
                  val b = syuCanbusModule ?: return
                  try {
                      val p = Parcel.obtain()
                      val r = Parcel.obtain()
                      p.writeInterfaceToken("com.syu.ipc.IRemoteModule")
                      p.writeInt(cmd)
                      p.writeIntArray(intArrayOf(param))
                      p.writeFloatArray(null)
                      p.writeStringArray(null)
                      b.transact(1, p, r, 0)
                      p.recycle()
                      r.recycle()
                  } catch (e: Exception) {}
              }

              private fun pushHvacToUi() {
                  sendJs("if(window.onHvacUpdate) window.onHvacUpdate(${hvacState.toString()});")
              }

              private fun startGpsSpeed() {
                  locationManager = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                  if (checkSelfPermission(android.Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(android.Manifest.permission.ACCESS_FINE_LOCATION), 101)
                      return
                  }
                  try {
                      locationManager?.requestLocationUpdates(LocationManager.GPS_PROVIDER, 400L, 0f, object : LocationListener {
                          override fun onLocationChanged(loc: Location) {
                              sendJs("if(window.onRealSpeed) window.onRealSpeed(${(loc.speed * 3.6f).roundToInt()});")
                          }
                          override fun onStatusChanged(p: String?, s: Int, e: Bundle?) {}
                      })
                  } catch (e: Exception) {}
              }

              private fun startMediaSessionPolling() {
                  handler.post(object : Runnable {
                      override fun run() {
                          pollMedia()
                          handler.postDelayed(this, 1000L)
                      }
                  })
              }

              private fun pollMedia() {
                  try {
                      val listeners = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: ""
                      val hasNoti = listeners.contains(packageName)
                      val hasOverlay = Settings.canDrawOverlays(this)
                      sendJs("if(window.onPermCheck) window.onPermCheck($hasNoti, $hasOverlay);")
                      if (!hasNoti) return

                      mediaSessionManager = getSystemService(Context.MEDIA_SESSION_SERVICE) as MediaSessionManager
                      val comp = ComponentName(this, MediaNotificationService::class.java)
                      val ctrls = mediaSessionManager?.getActiveSessions(comp) ?: emptyList()
                      if (ctrls.isNotEmpty()) {
                          activeController = ctrls.firstOrNull { it.playbackState?.state == PlaybackState.STATE_PLAYING } ?: ctrls[0]
                          val c = activeController!!
                          val m = c.metadata
                          val st = c.playbackState
                          val obj = JSONObject().apply {
                              put("title", m?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: "재생 중인 미디어")
                              put("artist", m?.getString(MediaMetadata.METADATA_KEY_ARTIST) ?: c.packageName)
                              put("duration", m?.getLong(MediaMetadata.METADATA_KEY_DURATION) ?: 0L)
                              put("position", st?.position ?: 0L)
                              put("playing", st?.state == PlaybackState.STATE_PLAYING)
                          }
                          val bmp: Bitmap? = m?.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART) ?: m?.getBitmap(MediaMetadata.METADATA_KEY_ART)
                          if (bmp != null) {
                              val bos = ByteArrayOutputStream()
                              bmp.compress(Bitmap.CompressFormat.JPEG, 70, bos)
                              obj.put("art", "data:image/jpeg;base64," + Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP))
                          }
                          sendJs("if(window.onMediaUpdate) window.onMediaUpdate(${obj.toString()});")
                      }
                  } catch (e: Exception) {}
              }

              private fun sendJs(script: String) {
                  runOnUiThread { webView.evaluateJavascript(script, null) }
              }

              override fun onResume() {
                  super.onResume()
                  HomeReturnService.allowStockLauncherTemporarily = false
                  hideSystemUI()
              }

              private fun hideSystemUI() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.let {
                          it.hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                          it.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION)
                  }
              }

              inner class FytCarBridge(private val context: Context) {

                  @JavascriptInterface
                  fun requestOverlayPermission() {
                      try {
                          val i = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")).apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          }
                          startActivity(i)
                      } catch (e: Exception) {}
                  }

                  @JavascriptInterface
                  fun requestNotiPermission() {
                      try {
                          startActivity(Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS").apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          })
                      } catch (e: Exception) {}
                  }

                  @JavascriptInterface
                  fun requestDefaultHome() {
                      try {
                          if (Settings.canDrawOverlays(context)) {
                              startService(Intent(context, HomeReturnService::class.java))
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              val rm = getSystemService(RoleManager::class.java)
                              if (rm != null && rm.isRoleAvailable(RoleManager.ROLE_HOME) && !rm.isRoleHeld(RoleManager.ROLE_HOME)) {
                                  startActivityForResult(rm.createRequestRoleIntent(RoleManager.ROLE_HOME), 202)
                                  return
                              }
                          }
                          startActivity(Intent(Settings.ACTION_HOME_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                      } catch (e: Exception) {}
                  }

                  // 원래 FYT 순정 런처(com.android.launcher66)로 돌아가기
                  @JavascriptInterface
                  fun goToStockFytLauncher() {
                      HomeReturnService.allowStockLauncherTemporarily = true
                      runOnUiThread { pipContainer?.visibility = View.GONE }
                      val stockCandidates = listOf("com.android.launcher66", "com.fyt.launcher", "com.android.launcher3")
                      for (pkg in stockCandidates) {
                          val intent = context.packageManager.getLaunchIntentForPackage(pkg)
                          if (intent != null) {
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              context.startActivity(intent)
                              return
                          }
                      }
                      startActivity(Intent(Settings.ACTION_HOME_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })
                  }

                  @JavascriptInterface
                  fun launchSlot(slotName: String, embedInBox: Boolean, x: Int, y: Int, w: Int, h: Int) {
                      val savedPkg = prefs.getString("slot_$slotName", null)
                      val candidates = when (slotName) {
                          "carplay" -> listOf(savedPkg, "com.syu.carlink", "com.zjinnova.zlink", "cn.manstep.phonemirrorBox", "com.carlinkit.autokit", "com.suding.speedplay")
                          "tmap" -> listOf(savedPkg, "com.skt.tmap.ku")
                          "kakao" -> listOf(savedPkg, "com.locnall.KimGiSa")
                          "naver" -> listOf(savedPkg, "com.nhn.android.nmap")
                          "obd" -> listOf(savedPkg, "com.ovz.carscanner", "org.prowl.torque")
                          else -> listOf(savedPkg)
                      }.filterNotNull()

                      var targetPkg: String? = null
                      for (pkg in candidates) {
                          if (context.packageManager.getLaunchIntentForPackage(pkg) != null) {
                              targetPkg = pkg
                              break
                          }
                      }
                      if (targetPkg == null) {
                          sendJs("window.openAppDrawer('$slotName')")
                          return
                      }

                      runOnUiThread {
                          val intent = context.packageManager.getLaunchIntentForPackage(targetPkg!!)!!
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_MULTIPLE_TASK)
                          if (embedInBox && virtualDisplay != null) {
                              pipContainer?.layoutParams = FrameLayout.LayoutParams(w, h).apply {
                                  leftMargin = x
                                  topMargin = y
                              }
                              pipContainer?.visibility = View.VISIBLE
                              val opts = ActivityOptions.makeBasic()
                              opts.launchDisplayId = virtualDisplay!!.display.displayId
                              context.startActivity(intent, opts.toBundle())
                          } else {
                              pipContainer?.visibility = View.GONE
                              context.startActivity(intent)
                          }
                      }
                  }

                  @JavascriptInterface
                  fun closePipBox() {
                      runOnUiThread { pipContainer?.visibility = View.GONE }
                  }

                  @JavascriptInterface
                  fun controlHvac(key: String, delta: Int) {
                      when (key) {
                          "wind" -> {
                              val next = (hvacState.optInt("windLevel", 2) + delta).coerceIn(0, 7)
                              hvacState.put("windLevel", next)
                              sendFytCanbusCmd(10, if (delta > 0) 1 else 0)
                          }
                          "ac" -> {
                              val next = !hvacState.optBoolean("ac", true)
                              hvacState.put("ac", next)
                              sendFytCanbusCmd(2, if (next) 1 else 0)
                          }
                          "cycle" -> {
                              val next = !hvacState.optBoolean("inOutCycle", true)
                              hvacState.put("inOutCycle", next)
                              sendFytCanbusCmd(3, if (next) 1 else 0)
                          }
                          "frontDef" -> {
                              val next = !hvacState.optBoolean("frontDefrost", false)
                              hvacState.put("frontDefrost", next)
                              sendFytCanbusCmd(5, if (next) 1 else 0)
                          }
                          "rearDef" -> {
                              val next = !hvacState.optBoolean("rearDefrost", false)
                              hvacState.put("rearDefrost", next)
                              sendFytCanbusCmd(6, if (next) 1 else 0)
                          }
                          "seatL" -> {
                              val next = (hvacState.optInt("seatHeatL", 0) + 1) % 4
                              hvacState.put("seatHeatL", next)
                              sendFytCanbusCmd(11, next)
                          }
                          "seatR" -> {
                              val next = (hvacState.optInt("seatHeatR", 0) + 1) % 4
                              hvacState.put("seatHeatR", next)
                              sendFytCanbusCmd(12, next)
                          }
                          "tempL" -> {
                              val cur = hvacState.optString("tempLeft", "21.0°").replace("°", "").toFloatOrNull() ?: 20.5f
                              val next = (cur + (delta * 0.5f)).coerceIn(16.0f, 30.0f)
                              hvacState.put("tempLeft", if (next <= 16.0f) "LO" else if (next >= 30.0f) "HI" else String.format("%.1f°", next))
                              sendFytCanbusCmd(8, if (delta > 0) 1 else 0)
                          }
                          "tempR" -> {
                              val cur = hvacState.optString("tempRight", "21.0°").replace("°", "").toFloatOrNull() ?: 20.5f
                              val next = (cur + (delta * 0.5f)).coerceIn(16.0f, 30.0f)
                              hvacState.put("tempRight", if (next <= 16.0f) "LO" else if (next >= 30.0f) "HI" else String.format("%.1f°", next))
                              sendFytCanbusCmd(9, if (delta > 0) 1 else 0)
                          }
                      }
                      pushHvacToUi()
                  }

                  @JavascriptInterface
                  fun saveSlotApp(slotName: String, pkg: String) {
                      prefs.edit().putString("slot_$slotName", pkg).apply()
                      Toast.makeText(context, "지정 완료: $pkg", Toast.LENGTH_SHORT).show()
                  }

                  @JavascriptInterface
                  fun launchPackage(pkg: String): Boolean {
                      return try {
                          runOnUiThread { pipContainer?.visibility = View.GONE }
                          val intent = context.packageManager.getLaunchIntentForPackage(pkg)
                          if (intent != null) {
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              context.startActivity(intent)
                              true
                          } else false
                      } catch (e: Exception) { false }
                  }

                  @JavascriptInterface
                  fun getInstalledApps(): String {
                      val arr = JSONArray()
                      try {
                          val pm = context.packageManager
                          val mainIntent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LAUNCHER) }
                          for (info in pm.queryIntentActivities(mainIntent, 0)) {
                              val pkg = info.activityInfo.packageName
                              if (pkg == context.packageName) continue
                              val obj = JSONObject()
                              obj.put("name", info.loadLabel(pm).toString())
                              obj.put("pkg", pkg)
                              arr.put(obj)
                          }
                      } catch (e: Exception) {}
                      return arr.toString()
                  }

                  @JavascriptInterface
                  fun sendMediaKey(action: String) {
                      try {
                          val ctrl = activeController
                          if (ctrl != null) {
                              when (action) {
                                  "prev" -> ctrl.transportControls.skipToPrevious()
                                  "next" -> ctrl.transportControls.skipToNext()
                                  "play" -> {
                                      if (ctrl.playbackState?.state == PlaybackState.STATE_PLAYING) ctrl.transportControls.pause()
                                      else ctrl.transportControls.play()
                                  }
                              }
                              return
                          }
                          val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          val code = when (action) {
                              "prev" -> KeyEvent.KEYCODE_MEDIA_PREVIOUS
                              "next" -> KeyEvent.KEYCODE_MEDIA_NEXT
                              else -> KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE
                          }
                          am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))
                          am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))
                      } catch (e: Exception) {}
                  }
              }
          }
          EOF

