                <button id="barCycle" class="btn active" style="height:40px;" onclick="AndroidBridge.controlHvac('cycle', 1)">내기순환</button>
                <button id="barFrontDef" class="btn" style="height:40px;" onclick="AndroidBridge.controlHvac('frontDef', 1)">전면성에</button>
                <button id="barRearDef" class="btn" style="height:40px;" onclick="AndroidBridge.controlHvac('rearDef', 1)">뒷유리</button>
              </div>

              <div style="display:flex; align-items:center; gap:5px;">
                <button id="barSeatR" class="btn" style="height:40px;" onclick="AndroidBridge.controlHvac('seatR', 1)">💺 0</button>
                <button class="btn" style="width:34px; height:40px; font-size:17px;" onclick="AndroidBridge.controlHvac('tempR', -1)">-</button>
                <div style="text-align:center; min-width:58px;">
                  <div style="font-size:9px; color:#94a3b8; font-weight:800;">PASSENGER</div>
                  <div id="barTempR" style="font-size:19px; font-weight:900; color:#38bdf8;">LO</div>
                </div>
                <button class="btn" style="width:34px; height:40px; font-size:17px;" onclick="AndroidBridge.controlHvac('tempR', 1)">+</button>
              </div>

              <button onclick="openHvacModal(true)" style="width:50px; height:50px; border-radius:25px; background:linear-gradient(135deg,#38bdf8,#0284c7); border:2px solid #bae6fd; color:#020617; font-weight:900; font-size:11px; flex-shrink:0;">
                ❄️ 공조
              </button>
            </footer>

            <div id="hvacModal" class="modal">
              <div class="glass" style="width:92%; max-width:920px; padding:20px; display:flex; flex-direction:column; gap:16px; border:1px solid rgba(56,189,248,0.35);">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div style="font-size:18px; font-weight:900;">2015 CAMARO DUAL CLIMATE CONTROL</div>
                  <button class="btn" onclick="openHvacModal(false)">닫기 ✕</button>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1.2fr 1fr; gap:14px; text-align:center;">
                  <div class="glass" style="padding:16px;">
                    <div style="font-size:12px; color:#94a3b8;">DRIVER</div>
                    <div id="modTempL" style="font-size:44px; font-weight:900; color:#38bdf8; margin:10px 0;">LO</div>
                    <div style="display:flex; justify-content:center; gap:8px;">
                      <button class="btn" style="padding:10px 18px;" onclick="AndroidBridge.controlHvac('tempL', -1)">▼</button>
                      <button class="btn" style="padding:10px 18px;" onclick="AndroidBridge.controlHvac('tempL', 1)">▲</button>
                    </div>
                  </div>
                  <div class="glass" style="padding:16px;">
                    <div style="font-size:12px; color:#94a3b8;">FAN SPEED</div>
                    <div id="modWind" style="font-size:34px; font-weight:900; margin:10px 0;">2단</div>
                    <div style="display:flex; justify-content:center; gap:8px;">
                      <button class="btn" style="padding:10px 18px;" onclick="AndroidBridge.controlHvac('wind', -1)">풍량 -</button>
                      <button class="btn" style="padding:10px 18px;" onclick="AndroidBridge.controlHvac('wind', 1)">풍량 +</button>
                    </div>
                  </div>
                  <div class="glass" style="padding:16px;">
                    <div style="font-size:12px; color:#94a3b8;">PASSENGER</div>
                    <div id="modTempR" style="font-size:44px; font-weight:900; color:#38bdf8; margin:10px 0;">LO</div>
                    <div style="display:flex; justify-content:center; gap:8px;">
                      <button class="btn" style="padding:10px 18px;" onclick="AndroidBridge.controlHvac('tempR', -1)">▼</button>
                      <button class="btn" style="padding:10px 18px;" onclick="AndroidBridge.controlHvac('tempR', 1)">▲</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div id="drawerModal" class="modal">
              <div class="glass" style="width:90%; max-width:900px; padding:18px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                  <div id="drawerHeader" style="font-size:16px; font-weight:900;">안드로이드 설치 앱 목록</div>
                  <button class="btn" onclick="openAppDrawer(false)">닫기 ✕</button>
                </div>
                <div id="appListGrid" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; max-height:65vh; overflow-y:auto;"></div>
              </div>
            </div>

            <script>
              let mapSlot = null;
              setInterval(() => {
                document.getElementById('clockTxt').textContent = new Date().toTimeString().slice(0,5);
              }, 1000);

              function triggerSlot(slot, embed) {
                const b = document.getElementById('carplayBox').getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                AndroidBridge.launchSlot(slot, embed, Math.round(b.left * dpr), Math.round(b.top * dpr), Math.round(b.width * dpr), Math.round(b.height * dpr));
              }

              function openHvacModal(show) {
                if (show) AndroidBridge.closePipBox();
                document.getElementById('hvacModal').classList.toggle('show', show);
              }

              function openAppDrawer(slot) {
                if (slot === false) {
                  document.getElementById('drawerModal').classList.remove('show');
                  return;
                }
                AndroidBridge.closePipBox();
                mapSlot = slot;
                const apps = JSON.parse(AndroidBridge.getInstalledApps() || '[]');
                document.getElementById('appListGrid').innerHTML = apps.map(a => `
                  <button class="btn" style="padding:10px; flex-direction:column; align-items:flex-start; text-align:left;" onclick="pickApp('${a.pkg}')">
                    <div style="font-size:12px; font-weight:900; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${a.name}</div>
                    <div style="font-size:9px; color:#64748b; width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${a.pkg}</div>
                  </button>
                `).join('');
                document.getElementById('drawerModal').classList.add('show');
              }

              function pickApp(pkg) {
                document.getElementById('drawerModal').classList.remove('show');
                if (mapSlot) {
                  AndroidBridge.saveSlotApp(mapSlot, pkg);
                  mapSlot = null;
                } else {
                  AndroidBridge.launchPackage(pkg);
                }
              }

              window.onPermCheck = function(hasNoti, hasOverlay) {
                document.getElementById('btnNotiPerm').style.display = hasNoti ? 'none' : 'inline-block';
                document.getElementById('btnOverlayPerm').style.display = hasOverlay ? 'none' : 'inline-block';
              };

              window.onHvacUpdate = function(st) {
                document.getElementById('barTempL').textContent = st.tempLeft;
                document.getElementById('barTempR').textContent = st.tempRight;
                document.getElementById('modTempL').textContent = st.tempLeft;
                document.getElementById('modTempR').textContent = st.tempRight;
                document.getElementById('barWind').textContent = st.windLevel + '단';
                document.getElementById('modWind').textContent = st.windLevel + '단';
                document.getElementById('barAc').classList.toggle('active', !!st.ac);
                document.getElementById('barCycle').classList.toggle('active', !!st.inOutCycle);
                document.getElementById('barFrontDef').classList.toggle('active', !!st.frontDefrost);
                document.getElementById('barRearDef').classList.toggle('active', !!st.rearDefrost);
                document.getElementById('barSeatL').textContent = '💺 ' + (st.seatHeatL || 0);
                document.getElementById('barSeatR').textContent = '💺 ' + (st.seatHeatR || 0);
                document.getElementById('doorVal').textContent = st.doorOpen ? '⚠️ 열림' : '잠김';
                document.getElementById('trunkVal').textContent = st.trunkOpen ? '⚠️ 열림' : '닫힘';
                document.getElementById('rawMonitor').textContent = st.lastRaw || '';
              };
              window.onCanbusBadge = function(txt) { document.getElementById('canbusBadge').textContent = txt; };
              window.onRealSpeed = function(s) { document.getElementById('spdVal').textContent = s; };
              window.onRealVolt = function(v) { document.getElementById('voltVal').textContent = v; };
              window.onMediaUpdate = function(m) {
                document.getElementById('songTitle').textContent = m.title || '재생 중';
                document.getElementById('songArtist').textContent = m.artist || '';
                document.getElementById('playPauseBtn').textContent = m.playing ? '❚❚ 일시정지' : '▶ 재생';
                if (m.duration > 0) {
                  document.getElementById('songProg').style.width = Math.min(100, Math.round((m.position / m.duration) * 100)) + '%';
                }
                const img = document.getElementById('albumImg');
                if (m.art) { img.src = m.art; img.style.display = 'block'; }
              };
            </script>
          </body>
          </html>
          EOF

          cd fyt_java
          gradle assembleDebug --no-daemon

      - name: 5. Upload Pure Java Camaro APK
        uses: actions/upload-artifact@v4
        with:
          name: Camaro-FYT7862-PureJava-APK
          path: fyt_java/app/build/outputs/apk/debug/app-debug.apk
