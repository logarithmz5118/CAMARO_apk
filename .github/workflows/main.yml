                  @JavascriptInterface
                  public void controlHvac(String key, int delta) {
                      try {
                          if ("wind".equals(key)) {
                              int next = Math.max(0, Math.min(7, hvacState.optInt("windLevel", 2) + delta));
                              hvacState.put("windLevel", next);
                              sendSyuCanbusCmd(10, delta > 0 ? 1 : 0);
                          } else if ("ac".equals(key)) {
                              boolean next = !hvacState.optBoolean("ac", true);
                              hvacState.put("ac", next);
                              sendSyuCanbusCmd(2, next ? 1 : 0);
                          } else if ("cycle".equals(key)) {
                              boolean next = !hvacState.optBoolean("inOutCycle", true);
                              hvacState.put("inOutCycle", next);
                              sendSyuCanbusCmd(3, next ? 1 : 0);
                          } else if ("frontDef".equals(key)) {
                              boolean next = !hvacState.optBoolean("frontDefrost", false);
                              hvacState.put("frontDefrost", next);
                              sendSyuCanbusCmd(5, next ? 1 : 0);
                          } else if ("rearDef".equals(key)) {
                              boolean next = !hvacState.optBoolean("rearDefrost", false);
                              hvacState.put("rearDefrost", next);
                              sendSyuCanbusCmd(6, next ? 1 : 0);
                          } else if ("seatL".equals(key)) {
                              int next = (hvacState.optInt("seatHeatL", 0) + 1) % 4;
                              hvacState.put("seatHeatL", next);
                              sendSyuCanbusCmd(11, next);
                          } else if ("seatR".equals(key)) {
                              int next = (hvacState.optInt("seatHeatR", 0) + 1) % 4;
                              hvacState.put("seatHeatR", next);
                              sendSyuCanbusCmd(12, next);
                          } else if ("tempL".equals(key)) {
                              String raw = hvacState.optString("tempLeft", "21.0°").replace("°", "");
                              float cur = 20.5f;
                              try { cur = Float.parseFloat(raw); } catch (Exception ignored) {}
                              float next = Math.max(16.0f, Math.min(30.0f, cur + (delta * 0.5f)));
                              hvacState.put("tempLeft", next <= 16.0f ? "LO" : (next >= 30.0f ? "HI" : String.format(Locale.US, "%.1f°", next)));
                              sendSyuCanbusCmd(8, delta > 0 ? 1 : 0);
                          } else if ("tempR".equals(key)) {
                              String raw = hvacState.optString("tempRight", "21.0°").replace("°", "");
                              float cur = 20.5f;
                              try { cur = Float.parseFloat(raw); } catch (Exception ignored) {}
                              float next = Math.max(16.0f, Math.min(30.0f, cur + (delta * 0.5f)));
                              hvacState.put("tempRight", next <= 16.0f ? "LO" : (next >= 30.0f ? "HI" : String.format(Locale.US, "%.1f°", next)));
                              sendSyuCanbusCmd(9, delta > 0 ? 1 : 0);
                          }
                      } catch (Exception ignored) {}
                      pushStateToUi();
                  }

