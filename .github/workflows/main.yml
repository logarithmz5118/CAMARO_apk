                      String saved = prefs.getString("slot_" + slotName, null);
                      List<String> candidates;
                      if ("carplay".equals(slotName)) {
                          candidates = Arrays.asList(saved, "com.syu.carlink", "com.zjinnova.zlink", "cn.manstep.phonemirrorBox", "com.carlinkit.autokit", "com.suding.speedplay");
                      } else if ("tmap".equals(slotName)) {
