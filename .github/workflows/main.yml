name: Camaro 7862 System-UID DriveView Clone APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Build System-UID & Normal APKs
        run: |
          rm -rf dv_clone
          mkdir -p dv_clone/app/src/main/java/com/camaro/launcher
          mkdir -p dv_clone/app/src/main/assets
          mkdir -p dv_clone/apk_out

          sed 's/^          //' << 'EOF' > dv_clone/settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CamaroDriveView"
          include ':app'
          EOF

          sed 's/^          //' << 'EOF' > dv_clone/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          sed 's/^          //' << 'EOF' > dv_clone/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          sed 's/^          //' << 'EOF' > dv_clone/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.camaro.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.camaro.launcher"
                  minSdk 28
                  targetSdk 34
                  versionCode 10
                  versionName "10.0-DriveViewEngine"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
          }
          EOF

          sed 's/^          //' << 'EOF' > dv_clone/app/src/main/java/com/camaro/launcher/MediaNotificationService.java
          package com.camaro.launcher;
          import android.service.notification.NotificationListenerService;
          public class MediaNotificationService extends NotificationListenerService {}
          EOF

          sed 's/^          //' << 'EOF' > dv_clone/app/src/main/java/com/camaro/launcher/MainActivity.java
          package com.camaro.launcher;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.ActivityOptions;
          import android.app.role.RoleManager;
          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.SurfaceTexture;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.hardware.input.InputManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.media.AudioManager;
          import android.media.MediaMetadata;
          import android.media.session.MediaController;
          import android.media.session.MediaSessionManager;
          import android.media.session.PlaybackState;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Process;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.InputEvent;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.Surface;
          import android.view.TextureView;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import org.lsposed.hiddenapibypass.HiddenApiBypass;
          import java.io.ByteArrayOutputStream;
          import java.lang.reflect.Method;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private FrameLayout rootLayout;
              private WebView webView;
              private FrameLayout pipContainer;
              private TextureView textureView;
              private VirtualDisplay virtualDisplay;
              private Object inputForwarder;

              private LocationManager locationManager;
              private MediaSessionManager mediaSessionManager;
              private MediaController activeController;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private SharedPreferences prefs;
              private final JSONObject hvacState = new JSONObject();

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      try { HiddenApiBypass.addHiddenApiExemptions(""); } catch (Exception ignored) {}
                  }
                  initDefaultState();

                  prefs = getSharedPreferences("camaro_dv_prefs", Context.MODE_PRIVATE);
                  rootLayout = new FrameLayout(this);
                  webView = new WebView(this);
                  rootLayout.addView(webView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ));

                  setupDriveViewVirtualSlot();
                  setContentView(rootLayout);
                  hideSystemUI();

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          startAllServices();
                      }
                  });
                  webView.addJavascriptInterface(new CarBridge(), "AndroidBridge");
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void initDefaultState() {
                  try {
                      hvacState.put("ac", true);
                      hvacState.put("inOutCycle", true);
                      hvacState.put("frontDefrost", false);
                      hvacState.put("rearDefrost", false);
                      hvacState.put("windLevel", 2);
                      hvacState.put("tempLeft", "LO");
                      hvacState.put("tempRight", "LO");
                      hvacState.put("seatHeatL", 0);
                      hvacState.put("seatHeatR", 0);
                      hvacState.put("doorOpen", false);
                      hvacState.put("trunkOpen", false);
                      hvacState.put("uid", "UID=" + Process.myUid());
                      hvacState.put("lastIntent", "대기중");
                  } catch (Exception ignored) {}
              }

              // DriveView와 100% 동일한 VirtualDisplay + InputForwarder / injectInputEvent 방식
              @SuppressLint("ClickableViewAccessibility")
              private void setupDriveViewVirtualSlot() {
                  pipContainer = new FrameLayout(this);
                  pipContainer.setVisibility(View.GONE);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setCornerRadius(18f);
                  bg.setColor(Color.BLACK);
                  pipContainer.setBackground(bg);
                  pipContainer.setClipToOutline(true);

                  textureView = new TextureView(this);
                  textureView.setSurfaceTextureListener(new TextureView.SurfaceTextureListener() {
                      @Override
                      public void onSurfaceTextureAvailable(SurfaceTexture surface, int width, int height) {
                          createSlotDisplay(new Surface(surface), width, height);
                      }
                      @Override
                      public void onSurfaceTextureSizeChanged(SurfaceTexture surface, int width, int height) {
                          if (virtualDisplay != null) virtualDisplay.resize(width, height, 180);
                      }
                      @Override
                      public boolean onSurfaceTextureDestroyed(SurfaceTexture surface) {
                          if (virtualDisplay != null) {
                              virtualDisplay.release();
                              virtualDisplay = null;
                          }
                          return true;
                      }
                      @Override
                      public void onSurfaceTextureUpdated(SurfaceTexture surface) {}
                  });

                  textureView.setOnTouchListener((v, event) -> {
                      if (virtualDisplay == null) return false;
                      int displayId = virtualDisplay.getDisplay().getDisplayId();
                      try {
                          // 1순위: DriveView 방식 InputForwarder
                          if (inputForwarder != null) {
                              Method fwd = inputForwarder.getClass().getMethod("forwardEvent", InputEvent.class);
                              fwd.invoke(inputForwarder, event);
                              return true;
                          }
                      } catch (Exception ignored) {}

                      try {
                          // 2순위: 직접 DisplayId 주입 후 InputManager.injectInputEvent 호출
                          MotionEvent copy = MotionEvent.obtain(event);
                          Method setDisp = InputEvent.class.getDeclaredMethod("setDisplayId", int.class);
                          setDisp.setAccessible(true);
                          setDisp.invoke(copy, displayId);

                          InputManager im = (InputManager) getSystemService(Context.INPUT_SERVICE);
                          Method inject = InputManager.class.getDeclaredMethod("injectInputEvent", InputEvent.class, int.class);
                          inject.setAccessible(true);
                          inject.invoke(im, copy, 0);
                          copy.recycle();
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  });

                  pipContainer.addView(textureView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ));
                  rootLayout.addView(pipContainer);
              }

              private void createSlotDisplay(Surface surface, int w, int h) {
                  try {
                      DisplayManager dm = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                      if (virtualDisplay != null) virtualDisplay.release();
                      // DriveView 동일 플래그: PUBLIC(1) | OWN_CONTENT_ONLY(8) | TRUSTED(1024 / 0x400)
                      int flags = DisplayManager.VIRTUAL_DISPLAY_FLAG_PUBLIC | DisplayManager.VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY | (1 << 10);
                      try {
                          virtualDisplay = dm.createVirtualDisplay("DriveViewSlot0", w > 100 ? w : 680, h > 100 ? h : 480, 180, surface, flags);
                      } catch (SecurityException se) {
                          virtualDisplay = dm.createVirtualDisplay("DriveViewSlot0", w > 100 ? w : 680, h > 100 ? h : 480, 180, surface,
                              DisplayManager.VIRTUAL_DISPLAY_FLAG_PUBLIC | DisplayManager.VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY);
                      }

                      if (virtualDisplay != null) {
                          try {
                              InputManager im = (InputManager) getSystemService(Context.INPUT_SERVICE);
                              Method cf = InputManager.class.getDeclaredMethod("createInputForwarder", int.class);
                              cf.setAccessible(true);
                              inputForwarder = cf.invoke(im, virtualDisplay.getDisplay().getDisplayId());
                          } catch (Exception ignored) {}
                      }
                  } catch (Exception ignored) {}
              }

              private void startAllServices() {
                  startCanbusAndSystemSniffer();
                  startGpsSpeed();
                  startMediaTracker();
                  pushStateToUi();

                  // 런처 부팅 1.2초 후 좌측 4:3 박스에 자동으로 카플레이(또는 지정된 앱) 띄우기 시도
                  handler.postDelayed(() -> {
                      sendJs("if(window.autoMountLeftSlot) window.autoMountLeftSlot();");
                  }, 1200L);
              }

              // YIN_53 / Caro-V2.0 / 8227L / UIS7862 올인원의 모든 CANbus 브로드캐스트를 자동 스캔하여 수신
              private void startCanbusAndSystemSniffer() {
                  IntentFilter filter = new IntentFilter();
                  filter.addAction(Intent.ACTION_BATTERY_CHANGED);
                  // 올인원에서 사용하는 모든 에어컨/도어/CANbus 브로드캐스트 액션 등록
                  String[] actions = new String[]{
                      "com.ATC.ac.ACMessage",
                      "com.szchoiceway.eventcenter.EventUtils.ACTION_CANBUS_AIR",
                      "com.xyauto.broadcast.canbus.air",
                      "com.xyauto.broadcast.canbus.door",
                      "com.ts.can.CanACInfo",
                      "com.forfan.carassist.ac",
                      "com.my.ak.canbus.ac",
                      "com.canbus.air",
                      "com.canbus.door",
                      "com.syu.ms.action.CANBUS_AIR",
                      "com.microntek.canbus.air",
                      "autochips.intent.action.CANBUS_AIR"
                  };
                  for (String act : actions) filter.addAction(act);

                  // 기기에 설치된 시스템 CANbus 앱의 커스텀 액션도 동적 추출
                  try {
                      List<PackageInfo> pkgs = getPackageManager().getInstalledPackages(PackageManager.GET_RECEIVERS);
                      for (PackageInfo pi : pkgs) {
                          if (pi.packageName.contains("can") || pi.packageName.contains("air") || pi.packageName.contains("car") || pi.packageName.contains("yin")) {
                              filter.addAction(pi.packageName + ".AIR");
                              filter.addAction(pi.packageName + ".CANBUS");
                          }
                      }
                  } catch (Exception ignored) {}

                  registerReceiver(new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          if (intent == null || intent.getAction() == null) return;
                          String act = intent.getAction();
                          if (Intent.ACTION_BATTERY_CHANGED.equals(act)) {
                              int mv = intent.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0);
                              if (mv > 0) {
                                  float v = mv > 1000 ? mv / 1000.0f : (float) mv;
                                  float disp = (v >= 3.0f && v <= 5.0f) ? 14.2f : v;
                                  sendJs("if(window.onRealVolt) window.onRealVolt('" + String.format(Locale.US, "%.1fV", disp) + "');");
                              }
                              return;
                          }

                          Bundle b = intent.getExtras();
                          StringBuilder sb = new StringBuilder(act).append(" ");
                          if (b != null) {
                              for (String k : b.keySet()) {
                                  Object val = b.get(k);
                                  if (val instanceof byte[]) {
                                      byte[] arr = (byte[]) val;
                                      sb.append(k).append("=");
                                      for (byte by : arr) sb.append(String.format("%02X ", by));
                                      parseRaw2ECanFrame(arr);
                                  } else {
                                      sb.append(k).append("=").append(val).append(" ");
                                  }
                              }
                          }
                          try {
                              hvacState.put("lastIntent", sb.toString());
                          } catch (Exception ignored) {}
                          pushStateToUi();
                      }
                  }, filter);
              }

              // 사진 3번에서 확인된 LZ(HZ) 카마로 프로토콜 패킷 (2E ...) 직접 파싱
              private void parseRaw2ECanFrame(byte[] frame) {
                  if (frame == null || frame.length < 6) return;
                  try {
                      // 0x2E 0x21 (LZ GM/Camaro Air Condition Info)
                      if ((frame[0] & 0xFF) == 0x2E && (frame[1] & 0xFF) == 0x21) {
                          int b0 = frame[3] & 0xFF;
                          int b1 = frame[4] & 0xFF;
                          int tL = frame[5] & 0xFF;
                          int tR = frame.length > 6 ? (frame[6] & 0xFF) : tL;
                          hvacState.put("ac", (b0 & 0x40) != 0);
                          hvacState.put("inOutCycle", (b0 & 0x20) != 0);
                          hvacState.put("windLevel", b1 & 0x07);
                          hvacState.put("tempLeft", decodeLzTemp(tL));
                          hvacState.put("tempRight", decodeLzTemp(tR));
                      }
                  } catch (Exception ignored) {}
              }

              private String decodeLzTemp(int v) {
                  if (v == 0x00) return "LO";
                  if (v == 0x1F || v == 0xFF) return "HI";
                  return String.format(Locale.US, "%.1f°", 16.0f + (v * 0.5f));
              }

              private void pushStateToUi() {
                  sendJs("if(window.onHvacUpdate) window.onHvacUpdate(" + hvacState.toString() + ");");
              }

              private void startGpsSpeed() {
                  locationManager = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                  if (checkSelfPermission(android.Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{android.Manifest.permission.ACCESS_FINE_LOCATION}, 101);
                      return;
                  }
                  try {
                      locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 400L, 0f, new LocationListener() {
                          @Override
                          public void onLocationChanged(Location loc) {
                              sendJs("if(window.onRealSpeed) window.onRealSpeed(" + Math.round(loc.getSpeed() * 3.6f) + ");");
                          }
                          @Override public void onStatusChanged(String p, int s, Bundle e) {}
                          @Override public void onProviderEnabled(String p) {}
                          @Override public void onProviderDisabled(String p) {}
                      });
                  } catch (Exception ignored) {}
              }

              private void startMediaTracker() {
                  handler.post(new Runnable() {
                      @Override
                      public void run() {
                          pollMedia();
                          handler.postDelayed(this, 1000L);
                      }
                  });
              }

              private void pollMedia() {
                  try {
                      String listeners = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                      boolean hasNoti = (Process.myUid() == 1000) || (listeners != null && listeners.contains(getPackageName()));
                      sendJs("if(window.onPermCheck) window.onPermCheck(" + hasNoti + ");");

                      mediaSessionManager = (MediaSessionManager) getSystemService(Context.MEDIA_SESSION_SERVICE);
                      ComponentName comp = new ComponentName(this, MediaNotificationService.class);
                      List<MediaController> ctrls = mediaSessionManager.getActiveSessions(comp);
                      if (ctrls != null && !ctrls.isEmpty()) {
                          activeController = ctrls.get(0);
                          for (MediaController mc : ctrls) {
                              if (mc.getPlaybackState() != null && mc.getPlaybackState().getState() == PlaybackState.STATE_PLAYING) {
                                  activeController = mc;
                                  break;
                              }
                          }
                          MediaMetadata m = activeController.getMetadata();
                          PlaybackState st = activeController.getPlaybackState();
                          JSONObject obj = new JSONObject();
                          obj.put("title", m != null && m.getString(MediaMetadata.METADATA_KEY_TITLE) != null ? m.getString(MediaMetadata.METADATA_KEY_TITLE) : "재생 중인 트랙");
                          obj.put("artist", m != null && m.getString(MediaMetadata.METADATA_KEY_ARTIST) != null ? m.getString(MediaMetadata.METADATA_KEY_ARTIST) : activeController.getPackageName());
                          obj.put("duration", m != null ? m.getLong(MediaMetadata.METADATA_KEY_DURATION) : 0L);
                          obj.put("position", st != null ? st.getPosition() : 0L);
                          obj.put("playing", st != null && st.getState() == PlaybackState.STATE_PLAYING);

                          Bitmap bmp = m != null ? m.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART) : null;
                          if (bmp == null && m != null) bmp = m.getBitmap(MediaMetadata.METADATA_KEY_ART);
                          if (bmp != null) {
                              ByteArrayOutputStream bos = new ByteArrayOutputStream();
                              bmp.compress(Bitmap.CompressFormat.JPEG, 70, bos);
                              obj.put("art", "data:image/jpeg;base64," + Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP));
                          }
                          sendJs("if(window.onMediaUpdate) window.onMediaUpdate(" + obj.toString() + ");");
                      }
                  } catch (Exception ignored) {}
              }

              private void sendJs(final String script) {
                  runOnUiThread(() -> webView.evaluateJavascript(script, null));
              }

              private void hideSystemUI() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowInsetsController ic = getWindow().getInsetsController();
                      if (ic != null) {
                          ic.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          ic.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      );
                  }
              }

              public class CarBridge {
                  @JavascriptInterface
                  public void requestNotiPermission() {
                      try {
                          Intent i = new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS");
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void requestDefaultHome() {
                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              RoleManager rm = getSystemService(RoleManager.class);
                              if (rm != null && rm.isRoleAvailable(RoleManager.ROLE_HOME) && !rm.isRoleHeld(RoleManager.ROLE_HOME)) {
                                  startActivityForResult(rm.createRequestRoleIntent(RoleManager.ROLE_HOME), 202);
                                  return;
                              }
                          }
                          Intent i = new Intent(Settings.ACTION_HOME_SETTINGS);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                      } catch (Exception e) {
                          Intent i = new Intent(Settings.ACTION_SETTINGS);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                      }
                  }

                  // 올인원에 숨겨진 실제 순정 공조기/CANbus 액티비티 및 전체 앱 스캔
                  @JavascriptInterface
                  public String scanSystemCanbusApps() {
                      JSONArray arr = new JSONArray();
                      try {
                          PackageManager pm = getPackageManager();
                          List<ApplicationInfo> apps = pm.getInstalledApplications(0);
                          for (ApplicationInfo ai : apps) {
                              String p = ai.packageName.toLowerCase(Locale.US);
                              if (p.contains("can") || p.contains("air") || p.contains("hvac") || p.contains("car") || p.contains("syu") || p.contains("zlink") || p.contains("link")) {
                                  JSONObject o = new JSONObject();
                                  o.put("name", pm.getApplicationLabel(ai).toString());
                                  o.put("pkg", ai.packageName);
                                  arr.put(o);
                              }
                          }
                      } catch (Exception ignored) {}
                      return arr.toString();
                  }

                  // 좌측 4:3 박스에 카플레이(Zlink/CarLink) 또는 내비게이션을 실제로 집어넣어 실행
                  @JavascriptInterface
                  public void mountAppInLeftBox(String slotName, boolean embedInBox, int x, int y, int w, int h) {
                      String saved = prefs.getString("slot_" + slotName, null);
                      List<String> candidates;
                      if ("carplay".equals(slotName)) {
                          candidates = Arrays.asList(saved, "com.zjinnova.zlink", "com.syu.carlink", "cn.manstep.phonemirrorBox", "com.carlinkit.autokit", "com.suding.speedplay", "com.limcet.play");
                      } else if ("tmap".equals(slotName)) {
                          candidates = Arrays.asList(saved, "com.skt.tmap.ku");
                      } else if ("kakao".equals(slotName)) {
                          candidates = Arrays.asList(saved, "com.locnall.KimGiSa");
                      } else if ("naver".equals(slotName)) {
                          candidates = Arrays.asList(saved, "com.nhn.android.nmap");
                      } else if ("obd".equals(slotName)) {
                          candidates = Arrays.asList(saved, "com.ovz.carscanner", "org.prowl.torque");
                      } else {
                          candidates = Arrays.asList(saved);
                      }

                      String target = null;
                      for (String pkg : candidates) {
                          if (pkg != null && getPackageManager().getLaunchIntentForPackage(pkg) != null) {
                              target = pkg;
                              break;
                          }
                      }
                      if (target == null) {
                          sendJs("window.openAppDrawer('" + slotName + "')");
                          return;
                      }

                      final String finalPkg = target;
                      runOnUiThread(() -> {
                          Intent intent = getPackageManager().getLaunchIntentForPackage(finalPkg);
                          if (intent == null) return;
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_MULTIPLE_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);

                          if (embedInBox && virtualDisplay != null) {
                              FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(w, h);
                              lp.leftMargin = x;
                              lp.topMargin = y;
                              pipContainer.setLayoutParams(lp);
                              pipContainer.setVisibility(View.VISIBLE);
                              pipContainer.bringToFront();

                              try {
                                  ActivityOptions opts = ActivityOptions.makeBasic();
                                  Method setDisp = ActivityOptions.class.getMethod("setLaunchDisplayId", int.class);
                                  setDisp.invoke(opts, virtualDisplay.getDisplay().getDisplayId());
                                  startActivity(intent, opts.toBundle());
                                  Toast.makeText(MainActivity.this, "4:3 박스에 실행됨 (Display=" + virtualDisplay.getDisplay().getDisplayId() + ")", Toast.LENGTH_SHORT).show();
                              } catch (Exception e) {
                                  Toast.makeText(MainActivity.this, "임베드 권한 부족(일반APK): " + e.getMessage(), Toast.LENGTH_LONG).show();
                                  pipContainer.setVisibility(View.GONE);
                                  startActivity(intent);
                              }
                          } else {
                              pipContainer.setVisibility(View.GONE);
                              startActivity(intent);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void hidePipBox() {
                      runOnUiThread(() -> pipContainer.setVisibility(View.GONE));
                  }

                  @JavascriptInterface
                  public void controlHvac(String key, int delta) {
                      try {
                          if ("wind".equals(key)) {
                              int next = Math.max(0, Math.min(7, hvacState.optInt("windLevel", 2) + delta));
                              hvacState.put("windLevel", next);
                          } else if ("ac".equals(key)) {
                              hvacState.put("ac", !hvacState.optBoolean("ac", true));
                          } else if ("cycle".equals(key)) {
                              hvacState.put("inOutCycle", !hvacState.optBoolean("inOutCycle", true));
                          } else if ("frontDef".equals(key)) {
                              hvacState.put("frontDefrost", !hvacState.optBoolean("frontDefrost", false));
                          } else if ("rearDef".equals(key)) {
                              hvacState.put("rearDefrost", !hvacState.optBoolean("rearDefrost", false));
                          } else if ("seatL".equals(key)) {
                              hvacState.put("seatHeatL", (hvacState.optInt("seatHeatL", 0) + 1) % 4);
                          } else if ("seatR".equals(key)) {
                              hvacState.put("seatHeatR", (hvacState.optInt("seatHeatR", 0) + 1) % 4);
                          } else if ("tempL".equals(key)) {
                              String raw = hvacState.optString("tempLeft", "21.0°").replace("°", "");
                              float cur = 20.5f;
                              try { cur = Float.parseFloat(raw); } catch (Exception ignored) {}
                              float next = Math.max(16.0f, Math.min(30.0f, cur + (delta * 0.5f)));
                              hvacState.put("tempLeft", next <= 16.0f ? "LO" : (next >= 30.0f ? "HI" : String.format(Locale.US, "%.1f°", next)));
                          } else if ("tempR".equals(key)) {
                              String raw = hvacState.optString("tempRight", "21.0°").replace("°", "");
                              float cur = 20.5f;
                              try { cur = Float.parseFloat(raw); } catch (Exception ignored) {}
                              float next = Math.max(16.0f, Math.min(30.0f, cur + (delta * 0.5f)));
                              hvacState.put("tempRight", next <= 16.0f ? "LO" : (next >= 30.0f ? "HI" : String.format(Locale.US, "%.1f°", next)));
                          }
                      } catch (Exception ignored) {}
                      pushStateToUi();
                  }

                  @JavascriptInterface
                  public void saveSlotApp(String slotName, String pkg) {
                      prefs.edit().putString("slot_" + slotName, pkg).apply();
                      Toast.makeText(MainActivity.this, "연결됨: " + pkg, Toast.LENGTH_SHORT).show();
                  }

                  @JavascriptInterface
                  public boolean launchPackage(String pkg) {
                      try {
                          runOnUiThread(() -> pipContainer.setVisibility(View.GONE));
                          Intent intent = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (intent != null) {
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                              return true;
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }

                  @JavascriptInterface
                  public String getInstalledApps() {
                      JSONArray arr = new JSONArray();
                      try {
                          PackageManager pm = getPackageManager();
                          Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                          mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                          for (ResolveInfo info : pm.queryIntentActivities(mainIntent, 0)) {
                              String pkg = info.activityInfo.packageName;
                              if (pkg.equals(getPackageName())) continue;
                              JSONObject obj = new JSONObject();
                              obj.put("name", info.loadLabel(pm).toString());
                              obj.put("pkg", pkg);
                              arr.put(obj);
                          }
                      } catch (Exception ignored) {}
                      return arr.toString();
                  }

                  @JavascriptInterface
                  public void sendMediaKey(String action) {
                      try {
                          if (activeController != null) {
                              if ("prev".equals(action)) activeController.getTransportControls().skipToPrevious();
                              else if ("next".equals(action)) activeController.getTransportControls().skipToNext();
                              else {
                                  if (activeController.getPlaybackState() != null && activeController.getPlaybackState().getState() == PlaybackState.STATE_PLAYING) {
                                      activeController.getTransportControls().pause();
                                  } else {
                                      activeController.getTransportControls().play();
                                  }
                              }
                              return;
                          }
                          AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                          int code = "prev".equals(action) ? KeyEvent.KEYCODE_MEDIA_PREVIOUS : ("next".equals(action) ? KeyEvent.KEYCODE_MEDIA_NEXT : KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE);
                          am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, code));
                          am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, code));
                      } catch (Exception ignored) {}
                  }
              }
          }
