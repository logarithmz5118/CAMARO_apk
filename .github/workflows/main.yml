                      } else if ("kakao".equals(slotName)) {
                          candidates = Arrays.asList(saved, "com.locnall.KimGiSa");
                      } else if ("naver".equals(slotName)) {
                          candidates = Arrays.asList(saved, "com.nhn.android.nmap");
                      } else if ("obd".equals(slotName)) {
                          candidates = Arrays.asList(saved, "com.ovz.carscanner", "org.prowl.torque");
                      } else {
                          candidates = Arrays.asList(saved);
                      }

                      String target = null;
                      for (String pkg : candidates) {
                          if (pkg != null && getPackageManager().getLaunchIntentForPackage(pkg) != null) {
                              target = pkg;
                              break;
                          }
                      }
                      if (target == null) {
