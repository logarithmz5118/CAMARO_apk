          cd dv_v12
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk apk_out/2_Camaro_v12_Normal.apk

          # 2) DriveView 동일 System UID 1000 버전 Manifest (HomeReturnService 및 WRITE_SECURE_SETTINGS 포함!)
          sed 's/^          //' << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              android:sharedUserId="android.uid.system">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
