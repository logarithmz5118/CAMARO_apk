name: One-Click Camaro APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Build Android APK from HTML
        run: |
          mkdir -p clean_project/app/src/main/java/com/camaro/launcher
          mkdir -p clean_project/app/src/main/assets

          HTML_FILE=$(find . -maxdepth 2 -name "*.html" | head -n 1)
          cp "$HTML_FILE" clean_project/app/src/main/assets/index.html

          printf '%s\n' \
            'pluginManagement {' \
            '    repositories { google(); mavenCentral(); gradlePluginPortal() }' \
            '}' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories { google(); mavenCentral() }' \
            '}' \
            'rootProject.name = "CamaroLauncher"' \
            'include(":app")' > clean_project/settings.gradle.kts

          printf '%s\n' \
            'plugins {' \
            '    id("com.android.application") version "8.2.2" apply false' \
            '    id("org.jetbrains.kotlin.android") version "1.9.22" apply false' \
            '}' > clean_project/build.gradle.kts

          printf '%s\n' \
            'android.useAndroidX=true' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' > clean_project/gradle.properties

          printf '%s\n' \
            'plugins {' \
            '    id("com.android.application")' \
            '    id("org.jetbrains.kotlin.android")' \
            '}' \
            'android {' \
            '    namespace = "com.camaro.launcher"' \
            '    compileSdk = 34' \
            '    defaultConfig {' \
            '        applicationId = "com.camaro.launcher"' \
            '        minSdk = 26' \
            '        targetSdk = 34' \
            '        versionCode = 1' \
            '        versionName = "1.0.0"' \
            '    }' \
            '    compileOptions {' \
            '        sourceCompatibility = JavaVersion.VERSION_17' \
            '        targetCompatibility = JavaVersion.VERSION_17' \
            '    }' \
            '    kotlinOptions { jvmTarget = "17" }' \
            '}' \
            'dependencies {}' > clean_project/app/build.gradle.kts

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <uses-permission android:name="android.permission.INTERNET" />' \
            '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' \
            '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' \
            '    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />' \
            '    <application' \
            '        android:allowBackup="true"' \
            '        android:label="Camaro RS Launcher"' \
            '        android:usesCleartextTraffic="true"' \
            '        android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">' \
            '        <activity' \
            '            android:name=".MainActivity"' \
            '            android:exported="true"' \
            '            android:launchMode="singleTask"' \
            '            android:screenOrientation="sensorLandscape"' \
            '            android:stateNotNeeded="true"' \
            '            android:configChanges="orientation|screenSize|keyboardHidden">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.HOME" />' \
            '                <category android:name="android.intent.category.DEFAULT" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '    </application>' \
            '</manifest>' > clean_project/app/src/main/AndroidManifest.xml

          printf '%s\n' \
            'package com.camaro.launcher' \
            'import android.annotation.SuppressLint' \
            'import android.app.Activity' \
            'import android.content.Context' \
            'import android.content.Intent' \
            'import android.media.AudioManager' \
            'import android.os.Build' \
            'import android.os.Bundle' \
            'import android.provider.Settings' \
            'import android.view.KeyEvent' \
            'import android.view.View' \
            'import android.view.WindowInsets' \
            'import android.view.WindowInsetsController' \
            'import android.webkit.JavascriptInterface' \
            'import android.webkit.WebChromeClient' \
            'import android.webkit.WebView' \
            'import android.webkit.WebViewClient' \
            'import android.widget.Toast' \
            'import org.json.JSONArray' \
            'import org.json.JSONObject' \
            'class MainActivity : Activity() {' \
            '    private lateinit var webView: WebView' \
            '    @SuppressLint("SetJavaScriptEnabled")' \
            '    override fun onCreate(savedInstanceState: Bundle?) {' \
            '        super.onCreate(savedInstanceState)' \
            '        webView = WebView(this)' \
            '        setContentView(webView)' \
            '        hideSystemUI()' \
            '        webView.settings.apply {' \
            '            javaScriptEnabled = true' \
            '            domStorageEnabled = true' \
            '            allowFileAccess = true' \
            '            mediaPlaybackRequiresUserGesture = false' \
            '        }' \
            '        webView.webChromeClient = WebChromeClient()' \
            '        webView.webViewClient = WebViewClient()' \
            '        webView.addJavascriptInterface(AndroidCarBridge(this), "AndroidBridge")' \
            '        webView.loadUrl("file:///android_asset/index.html")' \
            '    }' \
            '    override fun onWindowFocusChanged(hasFocus: Boolean) {' \
            '        super.onWindowFocusChanged(hasFocus)' \
            '        if (hasFocus) hideSystemUI()' \
            '    }' \
            '    private fun hideSystemUI() {' \
            '        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {' \
            '            window.insetsController?.let {' \
            '                it.hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())' \
            '                it.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE' \
            '            }' \
            '        } else {' \
            '            @Suppress("DEPRECATION")' \
            '            window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION)' \
            '        }' \
            '    }' \
            '    override fun onBackPressed() {' \
            '        webView.evaluateJavascript("if(window.closeAllModals) window.closeAllModals();", null)' \
            '    }' \
            '    inner class AndroidCarBridge(private val context: Context) {' \
            '        @JavascriptInterface' \
            '        fun launchApp(packageName: String): Boolean {' \
            '            return try {' \
            '                val pm = context.packageManager' \
            '                val intent = pm.getLaunchIntentForPackage(packageName)' \
            '                if (intent != null) {' \
            '                    intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)' \
            '                    context.startActivity(intent)' \
            '                    true' \
            '                } else {' \
            '                    Toast.makeText(context, "미설치 앱: " + packageName, Toast.LENGTH_SHORT).show()' \
            '                    false' \
            '                }' \
            '            } catch (e: Exception) { false }' \
            '        }' \
            '        @JavascriptInterface' \
            '        fun getInstalledApps(): String {' \
            '            val arr = JSONArray()' \
            '            try {' \
            '                val pm = context.packageManager' \
            '                val mainIntent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LAUNCHER) }' \
            '                for (info in pm.queryIntentActivities(mainIntent, 0)) {' \
            '                    val pkg = info.activityInfo.packageName' \
            '                    if (pkg == context.packageName) continue' \
            '                    val obj = JSONObject()' \
            '                    obj.put("name", info.loadLabel(pm).toString())' \
            '                    obj.put("pkg", pkg)' \
            '                    arr.put(obj)' \
            '                }' \
            '            } catch (e: Exception) {}' \
            '            return arr.toString()' \
            '        }' \
            '        @JavascriptInterface' \
            '        fun returnToStockHome() {' \
            '            try {' \
            '                context.startActivity(Intent(Settings.ACTION_HOME_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) })' \
            '            } catch (e: Exception) {}' \
            '        }' \
            '        @JavascriptInterface' \
            '        fun sendMediaKey(action: String) {' \
            '            try {' \
            '                val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager' \
            '                val code = when (action) { "prev" -> KeyEvent.KEYCODE_MEDIA_PREVIOUS; "next" -> KeyEvent.KEYCODE_MEDIA_NEXT; else -> KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE }' \
            '                am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))' \
            '                am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))' \
            '            } catch (e: Exception) {}' \
            '        }' \
            '    }' \
            '}' > clean_project/app/src/main/java/com/camaro/launcher/MainActivity.kt

          cd clean_project
          gradle assembleDebug --no-daemon

      - name: 5. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camaro-RS-Launcher-APK
          path: clean_project/app/build/outputs/apk/debug/app-debug.apk
