name: Camaro 7862 Pure Java Zero-Error APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 4. Build Pure Java FYT 7862 APK
        run: |
          rm -rf fyt_java
          mkdir -p fyt_java/app/src/main/java/com/camaro/launcher
          mkdir -p fyt_java/app/src/main/assets

          sed 's/^          //' << 'EOF' > fyt_java/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CamaroFYTLauncher"
          include ':app'
          EOF

          sed 's/^          //' << 'EOF' > fyt_java/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          sed 's/^          //' << 'EOF' > fyt_java/gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          sed 's/^          //' << 'EOF' > fyt_java/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.camaro.launcher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.camaro.launcher"
                  minSdk 28
                  targetSdk 34
                  versionCode 6
                  versionName "6.0-PureJava-FYT7862"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {}
          EOF

          sed 's/^          //' << 'EOF' > fyt_java/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.REORDER_TASKS" />
              <uses-permission android:name="android.permission.GET_TASKS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="true"
                  android:label="Camaro RS Launcher"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:stateNotNeeded="true"
                      android:clearTaskOnLaunch="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode">
                      <intent-filter android:priority="1000">
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MediaNotificationService"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

                  <service
                      android:name=".HomeReturnService"
                      android:enabled="true"
                      android:exported="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          sed 's/^          //' << 'EOF' > fyt_java/app/src/main/java/com/camaro/launcher/MediaNotificationService.java
          package com.camaro.launcher;
          import android.service.notification.NotificationListenerService;
          public class MediaNotificationService extends NotificationListenerService {}
          EOF

          sed 's/^          //' << 'EOF' > fyt_java/app/src/main/java/com/camaro/launcher/BootReceiver.java
          package com.camaro.launcher;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  Intent i = new Intent(context, MainActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  context.startActivity(i);
              }
          }
          EOF

          sed 's/^          //' << 'EOF' > fyt_java/app/src/main/java/com/camaro/launcher/HomeReturnService.java
          package com.camaro.launcher;

          import android.app.ActivityManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.TextView;
          import java.util.List;

          public class HomeReturnService extends Service {
              private WindowManager wm;
              private View floatingBtn;
              private final Handler handler = new Handler(Looper.getMainLooper());
              public static boolean allowStockTemporarily = false;

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onCreate() {
                  super.onCreate();
                  createFloatingPill();
                  startFytHomeWatcher();
              }

              private void createFloatingPill() {
                  if (!Settings.canDrawOverlays(this)) return;
                  wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                  TextView pill = new TextView(this);
                  pill.setText("🏠 카마로 홈");
                  pill.setTextColor(Color.parseColor("#38BDF8"));
                  pill.setTextSize(11f);
                  pill.setPadding(24, 10, 24, 10);

                  GradientDrawable bg = new GradientDrawable();
                  bg.setCornerRadius(40f);
                  bg.setColor(Color.parseColor("#CC090D16"));
                  bg.setStroke(2, Color.parseColor("#6638BDF8"));
                  pill.setBackground(bg);

                  pill.setOnClickListener(v -> {
                      allowStockTemporarily = false;
                      Intent i = new Intent(HomeReturnService.this, MainActivity.class);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                      startActivity(i);
                  });

                  WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  );
                  params.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  params.y = 4;
                  try {
                      wm.addView(pill, params);
                      floatingBtn = pill;
                  } catch (Exception ignored) {}
              }

              private void startFytHomeWatcher() {
                  handler.post(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              if (!allowStockTemporarily) {
                                  ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                                  List<ActivityManager.RunningTaskInfo> tasks = am.getRunningTasks(1);
                                  if (tasks != null && !tasks.isEmpty() && tasks.get(0).topActivity != null) {
                                      String topPkg = tasks.get(0).topActivity.getPackageName();
                                      if (topPkg.contains("launcher66") || topPkg.contains("com.fyt.launcher") || topPkg.contains("com.android.launcher3")) {
                                          Intent i = new Intent(HomeReturnService.this, MainActivity.class);
                                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                                          startActivity(i);
                                      }
                                  }
                              }
                          } catch (Exception ignored) {}
                          handler.postDelayed(this, 350L);
                      }
                  });
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (floatingBtn != null && wm != null) {
                      try { wm.removeView(floatingBtn); } catch (Exception ignored) {}
                  }
              }
          }
          EOF

          sed 's/^          //' << 'EOF' > fyt_java/app/src/main/java/com/camaro/launcher/MainActivity.java
          package com.camaro.launcher;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.ActivityOptions;
          import android.app.role.RoleManager;
          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.ServiceConnection;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.SurfaceTexture;
          import android.graphics.drawable.GradientDrawable;
          import android.hardware.display.DisplayManager;
          import android.hardware.display.VirtualDisplay;
          import android.hardware.input.InputManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.media.AudioManager;
          import android.media.MediaMetadata;
          import android.media.session.MediaController;
          import android.media.session.MediaSessionManager;
          import android.media.session.PlaybackState;
          import android.net.Uri;
          import android.os.BatteryManager;
          import android.os.Binder;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.Parcel;
          import android.provider.Settings;
          import android.util.Base64;
          import android.view.InputEvent;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.Surface;
          import android.view.TextureView;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.ByteArrayOutputStream;
          import java.lang.reflect.Method;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private FrameLayout rootLayout;
              private WebView webView;
              private FrameLayout pipContainer;
              private TextureView textureView;
              private VirtualDisplay virtualDisplay;

              private LocationManager locationManager;
              private MediaSessionManager mediaSessionManager;
              private MediaController activeController;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private SharedPreferences prefs;
              private IBinder syuCanbusModule;
              private final JSONObject hvacState = new JSONObject();

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  initDefaultHvac();

                  prefs = getSharedPreferences("camaro_fyt_java", Context.MODE_PRIVATE);
                  rootLayout = new FrameLayout(this);
                  webView = new WebView(this);
                  rootLayout.addView(webView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ));

                  setupVirtualDisplayBox();
                  setContentView(rootLayout);
                  hideSystemUI();

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebChromeClient(new WebChromeClient());
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          initAllSystems();
                      }
                  });
                  webView.addJavascriptInterface(new FytBridge(), "AndroidBridge");
                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void initDefaultHvac() {
                  try {
                      hvacState.put("ac", true);
                      hvacState.put("inOutCycle", true);
                      hvacState.put("frontDefrost", false);
                      hvacState.put("rearDefrost", false);
                      hvacState.put("windLevel", 2);
                      hvacState.put("tempLeft", "LO");
                      hvacState.put("tempRight", "LO");
                      hvacState.put("seatHeatL", 0);
                      hvacState.put("seatHeatR", 0);
                      hvacState.put("doorOpen", false);
                      hvacState.put("trunkOpen", false);
                      hvacState.put("lastRaw", "대기중");
                  } catch (Exception ignored) {}
              }

              @SuppressLint("ClickableViewAccessibility")
              private void setupVirtualDisplayBox() {
                  pipContainer = new FrameLayout(this);
                  pipContainer.setVisibility(View.GONE);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setCornerRadius(20f);
                  bg.setColor(Color.BLACK);
                  pipContainer.setBackground(bg);
                  pipContainer.setClipToOutline(true);

                  textureView = new TextureView(this);
                  textureView.setSurfaceTextureListener(new TextureView.SurfaceTextureListener() {
                      @Override
                      public void onSurfaceTextureAvailable(SurfaceTexture surface, int width, int height) {
                          createVD(new Surface(surface), width, height);
                      }
                      @Override
                      public void onSurfaceTextureSizeChanged(SurfaceTexture surface, int width, int height) {
                          if (virtualDisplay != null) virtualDisplay.resize(width, height, 220);
                      }
                      @Override
                      public boolean onSurfaceTextureDestroyed(SurfaceTexture surface) {
                          if (virtualDisplay != null) {
                              virtualDisplay.release();
                              virtualDisplay = null;
                          }
                          return true;
                      }
                      @Override
                      public void onSurfaceTextureUpdated(SurfaceTexture surface) {}
                  });

                  textureView.setOnTouchListener((v, event) -> {
                      if (virtualDisplay == null) return false;
                      int displayId = virtualDisplay.getDisplay().getDisplayId();
                      try {
                          MotionEvent copy = MotionEvent.obtain(event);
                          Method setDisp = InputEvent.class.getDeclaredMethod("setDisplayId", int.class);
                          setDisp.setAccessible(true);
                          setDisp.invoke(copy, displayId);

                          InputManager im = (InputManager) getSystemService(Context.INPUT_SERVICE);
                          Method inject = InputManager.class.getDeclaredMethod("injectInputEvent", InputEvent.class, int.class);
                          inject.setAccessible(true);
                          inject.invoke(im, copy, 0);
                          copy.recycle();
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  });

                  pipContainer.addView(textureView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ));
                  rootLayout.addView(pipContainer);
              }

              private void createVD(Surface surface, int w, int h) {
                  try {
                      DisplayManager dm = (DisplayManager) getSystemService(Context.DISPLAY_SERVICE);
                      if (virtualDisplay != null) virtualDisplay.release();
                      virtualDisplay = dm.createVirtualDisplay(
                          "CamaroCarPlayVD",
                          w > 100 ? w : 700,
                          h > 100 ? h : 500,
                          220,
                          surface,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_PUBLIC | DisplayManager.VIRTUAL_DISPLAY_FLAG_OWN_CONTENT_ONLY
                      );
                  } catch (Exception ignored) {}
              }

              private void initAllSystems() {
                  if (Settings.canDrawOverlays(this)) {
                      startService(new Intent(this, HomeReturnService.class));
                  }
                  bindFytSyuToolkit();
                  startBatteryReceiver();
                  startGpsSpeed();
                  startMediaPolling();
                  pushHvac();
              }

              private void bindFytSyuToolkit() {
                  String[] pkgs = new String[]{"com.syu.ms", "com.syu.canbus"};
                  for (String pkg : pkgs) {
                      try {
                          Intent intent = new Intent("com.syu.ms.toolkit").setPackage(pkg);
                          bindService(intent, new ServiceConnection() {
                              @Override
                              public void onServiceConnected(ComponentName name, IBinder service) {
                                  if (service == null) return;
                                  try {
                                      Parcel data = Parcel.obtain();
                                      Parcel reply = Parcel.obtain();
                                      data.writeInterfaceToken("com.syu.ipc.IRemoteToolkit");
                                      data.writeInt(7); // CANBUS = 7
                                      service.transact(1, data, reply, 0);
                                      reply.readException();
                                      syuCanbusModule = reply.readStrongBinder();
                                      data.recycle();
                                      reply.recycle();
                                      if (syuCanbusModule != null) {
                                          registerCanbusCallbacks(syuCanbusModule);
                                          sendJs("window.onCanbusBadge('FYT 7862 LZ-Camaro 직결됨')");
                                      }
                                  } catch (Exception ignored) {}
                              }
                              @Override
                              public void onServiceDisconnected(ComponentName name) {}
                          }, Context.BIND_AUTO_CREATE);
                      } catch (Exception ignored) {}
                  }
              }

              private void registerCanbusCallbacks(IBinder moduleBinder) {
                  Binder cb = new Binder() {
                      @Override
                      protected boolean onTransact(int code, Parcel data, Parcel reply, int flags) {
                          if (code == 1) {
                              try {
                                  data.enforceInterface("com.syu.ipc.IModuleCallback");
                                  int uCode = data.readInt();
                                  int[] ints = data.createIntArray();
                                  if (ints != null && ints.length > 0) {
                                      handleCanbusCode(uCode, ints[0]);
                                  }
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  };
                  for (int i = 0; i <= 120; i++) {
                      try {
                          Parcel p = Parcel.obtain();
                          Parcel r = Parcel.obtain();
                          p.writeInterfaceToken("com.syu.ipc.IRemoteModule");
                          p.writeStrongBinder(cb);
                          p.writeInt(i);
                          p.writeInt(1);
                          moduleBinder.transact(2, p, r, 0);
                          p.recycle();
                          r.recycle();
                      } catch (Exception ignored) {}
                  }
              }

              private void handleCanbusCode(int code, int val) {
                  try {
                      hvacState.put("lastRaw", "Code[" + code + "]=" + val);
                      switch (code) {
                          case 0: case 1: case 2: case 3:
                              hvacState.put("doorOpen", val == 1); break;
                          case 4:
                              hvacState.put("trunkOpen", val == 1); break;
                          case 11:
                              hvacState.put("ac", val == 1); break;
                          case 12:
                              hvacState.put("inOutCycle", val == 1); break;
                          case 15: case 18:
                              hvacState.put("frontDefrost", val == 1); break;
                          case 16:
                              hvacState.put("rearDefrost", val == 1); break;
                          case 21:
                              hvacState.put("windLevel", Math.max(0, Math.min(7, val))); break;
                          case 27:
                              hvacState.put("tempLeft", formatTemp(val)); break;
                          case 28:
                              hvacState.put("tempRight", formatTemp(val)); break;
                          case 29:
                              hvacState.put("seatHeatL", Math.max(0, Math.min(3, val))); break;
                          case 30:
                              hvacState.put("seatHeatR", Math.max(0, Math.min(3, val))); break;
                      }
                  } catch (Exception ignored) {}
                  pushHvac();
              }

              private String formatTemp(int v) {
                  if (v <= 0 || v == 254) return "LO";
                  if (v == 255 || v >= 1000) return "HI";
                  if (v >= 15 && v <= 32) return v + ".0°";
                  if (v >= 30 && v <= 65) return String.format(Locale.US, "%.1f°", v / 2.0f);
                  if (v >= 150 && v <= 320) return String.format(Locale.US, "%.1f°", v / 10.0f);
                  return v + "°";
              }

              private void startBatteryReceiver() {
                  IntentFilter filter = new IntentFilter(Intent.ACTION_BATTERY_CHANGED);
                  registerReceiver(new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          int mv = intent.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0);
                          if (mv > 0) {
                              float v = mv > 1000 ? mv / 1000.0f : (float) mv;
                              float disp = (v >= 3.0f && v <= 5.0f) ? 14.3f : v;
                              sendJs("window.onRealVolt('" + String.format(Locale.US, "%.1f", disp) + "V')");
                          }
                      }
                  }, filter);
              }

              private void sendCanbusCmd(int cmd, int param) {
                  if (syuCanbusModule == null) return;
                  try {
                      Parcel p = Parcel.obtain();
                      Parcel r = Parcel.obtain();
                      p.writeInterfaceToken("com.syu.ipc.IRemoteModule");
                      p.writeInt(cmd);
                      p.writeIntArray(new int[]{param});
                      p.writeFloatArray(null);
                      p.writeStringArray(null);
                      syuCanbusModule.transact(1, p, r, 0);
                      p.recycle();
                      r.recycle();
                  } catch (Exception ignored) {}
              }

              private void pushHvac() {
                  sendJs("if(window.onHvacUpdate) window.onHvacUpdate(" + hvacState.toString() + ");");
              }

              private void startGpsSpeed() {
                  locationManager = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                  if (checkSelfPermission(android.Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{android.Manifest.permission.ACCESS_FINE_LOCATION}, 101);
                      return;
                  }
                  try {
                      locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 400L, 0f, new LocationListener() {
                          @Override
                          public void onLocationChanged(Location loc) {
                              int kmh = Math.round(loc.getSpeed() * 3.6f);
                              sendJs("if(window.onRealSpeed) window.onRealSpeed(" + kmh + ");");
                          }
                          @Override public void onStatusChanged(String p, int s, Bundle e) {}
                          @Override public void onProviderEnabled(String p) {}
                          @Override public void onProviderDisabled(String p) {}
                      });
                  } catch (Exception ignored) {}
              }

              private void startMediaPolling() {
                  handler.post(new Runnable() {
                      @Override
                      public void run() {
                          pollMedia();
                          handler.postDelayed(this, 1000L);
                      }
                  });
              }

              private void pollMedia() {
                  try {
                      String listeners = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                      boolean hasNoti = listeners != null && listeners.contains(getPackageName());
                      boolean hasOverlay = Settings.canDrawOverlays(this);
                      sendJs("if(window.onPermCheck) window.onPermCheck(" + hasNoti + ", " + hasOverlay + ");");
                      if (!hasNoti) return;

                      mediaSessionManager = (MediaSessionManager) getSystemService(Context.MEDIA_SESSION_SERVICE);
                      ComponentName comp = new ComponentName(this, MediaNotificationService.class);
                      List<MediaController> ctrls = mediaSessionManager.getActiveSessions(comp);
                      if (ctrls != null && !ctrls.isEmpty()) {
                          activeController = ctrls.get(0);
                          for (MediaController mc : ctrls) {
                              if (mc.getPlaybackState() != null && mc.getPlaybackState().getState() == PlaybackState.STATE_PLAYING) {
                                  activeController = mc;
                                  break;
                              }
                          }
                          MediaMetadata m = activeController.getMetadata();
                          PlaybackState st = activeController.getPlaybackState();
                          JSONObject obj = new JSONObject();
                          obj.put("title", m != null && m.getString(MediaMetadata.METADATA_KEY_TITLE) != null ? m.getString(MediaMetadata.METADATA_KEY_TITLE) : "재생 중인 미디어");
                          obj.put("artist", m != null && m.getString(MediaMetadata.METADATA_KEY_ARTIST) != null ? m.getString(MediaMetadata.METADATA_KEY_ARTIST) : activeController.getPackageName());
                          obj.put("duration", m != null ? m.getLong(MediaMetadata.METADATA_KEY_DURATION) : 0L);
                          obj.put("position", st != null ? st.getPosition() : 0L);
                          obj.put("playing", st != null && st.getState() == PlaybackState.STATE_PLAYING);

                          Bitmap bmp = m != null ? m.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART) : null;
                          if (bmp == null && m != null) bmp = m.getBitmap(MediaMetadata.METADATA_KEY_ART);
                          if (bmp != null) {
                              ByteArrayOutputStream bos = new ByteArrayOutputStream();
                              bmp.compress(Bitmap.CompressFormat.JPEG, 70, bos);
                              obj.put("art", "data:image/jpeg;base64," + Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP));
                          }
                          sendJs("if(window.onMediaUpdate) window.onMediaUpdate(" + obj.toString() + ");");
                      }
                  } catch (Exception ignored) {}
              }

              private void sendJs(final String script) {
                  runOnUiThread(() -> webView.evaluateJavascript(script, null));
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  HomeReturnService.allowStockTemporarily = false;
                  hideSystemUI();
              }

              private void hideSystemUI() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      WindowInsetsController ic = getWindow().getInsetsController();
                      if (ic != null) {
                          ic.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          ic.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      );
                  }
              }

              public class FytBridge {
                  @JavascriptInterface
                  public void requestOverlayPermission() {
                      try {
                          Intent i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void requestNotiPermission() {
                      try {
                          Intent i = new Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS");
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void requestDefaultHome() {
                      try {
                          if (Settings.canDrawOverlays(MainActivity.this)) {
                              startService(new Intent(MainActivity.this, HomeReturnService.class));
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              RoleManager rm = getSystemService(RoleManager.class);
                              if (rm != null && rm.isRoleAvailable(RoleManager.ROLE_HOME) && !rm.isRoleHeld(RoleManager.ROLE_HOME)) {
                                  startActivityForResult(rm.createRequestRoleIntent(RoleManager.ROLE_HOME), 202);
                                  return;
                              }
                          }
                          Intent i = new Intent(Settings.ACTION_HOME_SETTINGS);
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void goToStockFytLauncher() {
                      HomeReturnService.allowStockTemporarily = true;
                      runOnUiThread(() -> pipContainer.setVisibility(View.GONE));
                      String[] stocks = new String[]{"com.android.launcher66", "com.fyt.launcher", "com.android.launcher3"};
                      for (String pkg : stocks) {
                          Intent i = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (i != null) {
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
                              return;
                          }
                      }
                      Intent i = new Intent(Settings.ACTION_HOME_SETTINGS);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  }

                  @JavascriptInterface
                  public void launchSlot(String slotName, boolean embedInBox, int x, int y, int w, int h) {
                      String saved = prefs.getString("slot_" + slotName, null);
                      List<String> candidates;
                      if ("carplay".equals(slotName)) {
                          candidates = Arrays.asList(saved, "com.syu.carlink", "com.zjinnova.zlink", "cn.manstep.phonemirrorBox", "com.carlinkit.autokit", "com.suding.speedplay");
                      } else if ("tmap".equals(slotName)) {
                          candidates = Arrays.asList(saved, "com.skt.tmap.ku");
                      } else if ("kakao".equals(slotName)) {
                          candidates = Arrays.asList(saved, "com.locnall.KimGiSa");
                      } else if ("naver".equals(slotName)) {
                          candidates = Arrays.asList(saved, "com.nhn.android.nmap");
                      } else if ("obd".equals(slotName)) {
                          candidates = Arrays.asList(saved, "com.ovz.carscanner", "org.prowl.torque");
                      } else {
                          candidates = Arrays.asList(saved);
                      }

                      String target = null;
                      for (String pkg : candidates) {
                          if (pkg != null && getPackageManager().getLaunchIntentForPackage(pkg) != null) {
                              target = pkg;
                              break;
                          }
                      }
                      if (target == null) {
                          sendJs("window.openAppDrawer('" + slotName + "')");
                          return;
                      }

                      final String finalPkg = target;
                      runOnUiThread(() -> {
                          Intent intent = getPackageManager().getLaunchIntentForPackage(finalPkg);
                          if (intent == null) return;
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_MULTIPLE_TASK);
                          if (embedInBox && virtualDisplay != null) {
                              FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(w, h);
                              lp.leftMargin = x;
                              lp.topMargin = y;
                              pipContainer.setLayoutParams(lp);
                              pipContainer.setVisibility(View.VISIBLE);
                              try {
                                  ActivityOptions opts = ActivityOptions.makeBasic();
                                  Method m = ActivityOptions.class.getMethod("setLaunchDisplayId", int.class);
                                  m.invoke(opts, virtualDisplay.getDisplay().getDisplayId());
                                  startActivity(intent, opts.toBundle());
                              } catch (Exception e) {
                                  startActivity(intent);
                              }
                          } else {
                              pipContainer.setVisibility(View.GONE);
                              startActivity(intent);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void closePipBox() {
                      runOnUiThread(() -> pipContainer.setVisibility(View.GONE));
                  }

                  @JavascriptInterface
                  public void controlHvac(String key, int delta) {
                      try {
                          if ("wind".equals(key)) {
                              int next = Math.max(0, Math.min(7, hvacState.optInt("windLevel", 2) + delta));
                              hvacState.put("windLevel", next);
                              sendCanbusCmd(10, delta > 0 ? 1 : 0);
                          } else if ("ac".equals(key)) {
                              boolean next = !hvacState.optBoolean("ac", true);
                              hvacState.put("ac", next);
                              sendCanbusCmd(2, next ? 1 : 0);
                          } else if ("cycle".equals(key)) {
                              boolean next = !hvacState.optBoolean("inOutCycle", true);
                              hvacState.put("inOutCycle", next);
                              sendCanbusCmd(3, next ? 1 : 0);
                          } else if ("frontDef".equals(key)) {
                              boolean next = !hvacState.optBoolean("frontDefrost", false);
                              hvacState.put("frontDefrost", next);
                              sendCanbusCmd(5, next ? 1 : 0);
                          } else if ("rearDef".equals(key)) {
                              boolean next = !hvacState.optBoolean("rearDefrost", false);
                              hvacState.put("rearDefrost", next);
                              sendCanbusCmd(6, next ? 1 : 0);
                          } else if ("seatL".equals(key)) {
                              int next = (hvacState.optInt("seatHeatL", 0) + 1) % 4;
                              hvacState.put("seatHeatL", next);
                              sendCanbusCmd(11, next);
                          } else if ("seatR".equals(key)) {
                              int next = (hvacState.optInt("seatHeatR", 0) + 1) % 4;
                              hvacState.put("seatHeatR", next);
                              sendCanbusCmd(12, next);
                          } else if ("tempL".equals(key)) {
                              String raw = hvacState.optString("tempLeft", "21.0°").replace("°", "");
                              float cur = 20.5f;
                              try { cur = Float.parseFloat(raw); } catch (Exception ignored) {}
                              float next = Math.max(16.0f, Math.min(30.0f, cur + (delta * 0.5f)));
                              hvacState.put("tempLeft", next <= 16.0f ? "LO" : (next >= 30.0f ? "HI" : String.format(Locale.US, "%.1f°", next)));
                              sendCanbusCmd(8, delta > 0 ? 1 : 0);
                          } else if ("tempR".equals(key)) {
                              String raw = hvacState.optString("tempRight", "21.0°").replace("°", "");
                              float cur = 20.5f;
                              try { cur = Float.parseFloat(raw); } catch (Exception ignored) {}
                              float next = Math.max(16.0f, Math.min(30.0f, cur + (delta * 0.5f)));
                              hvacState.put("tempRight", next <= 16.0f ? "LO" : (next >= 30.0f ? "HI" : String.format(Locale.US, "%.1f°", next)));
                              sendCanbusCmd(9, delta > 0 ? 1 : 0);
                          }
                      } catch (Exception ignored) {}
                      pushHvac();
                  }

                  @JavascriptInterface
                  public void saveSlotApp(String slotName, String pkg) {
                      prefs.edit().putString("slot_" + slotName, pkg).apply();
                      Toast.makeText(MainActivity.this, "지정 완료: " + pkg, Toast.LENGTH_SHORT).show();
                  }

                  @JavascriptInterface
                  public boolean launchPackage(String pkg) {
                      try {
                          runOnUiThread(() -> pipContainer.setVisibility(View.GONE));
                          Intent intent = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (intent != null) {
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                              return true;
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }

                  @JavascriptInterface
                  public String getInstalledApps() {
                      JSONArray arr = new JSONArray();
                      try {
                          PackageManager pm = getPackageManager();
                          Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                          mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                          for (ResolveInfo info : pm.queryIntentActivities(mainIntent, 0)) {
                              String pkg = info.activityInfo.packageName;
                              if (pkg.equals(getPackageName())) continue;
                              JSONObject obj = new JSONObject();
                              obj.put("name", info.loadLabel(pm).toString());
                              obj.put("pkg", pkg);
                              arr.put(obj);
                          }
                      } catch (Exception ignored) {}
                      return arr.toString();
                  }

                  @JavascriptInterface
                  public void sendMediaKey(String action) {
                      try {
                          if (activeController != null) {
                              if ("prev".equals(action)) activeController.getTransportControls().skipToPrevious();
                              else if ("next".equals(action)) activeController.getTransportControls().skipToNext();
                              else {
                                  if (activeController.getPlaybackState() != null && activeController.getPlaybackState().getState() == PlaybackState.STATE_PLAYING) {
                                      activeController.getTransportControls().pause();
                                  } else {
                                      activeController.getTransportControls().play();
                                  }
                              }
                              return;
                          }
                          AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                          int code = "prev".equals(action) ? KeyEvent.KEYCODE_MEDIA_PREVIOUS : ("next".equals(action) ? KeyEvent.KEYCODE_MEDIA_NEXT : KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE);
                          am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN, code));
                          am.dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP, code));
                      } catch (Exception ignored) {}
                  }
              }
          }
